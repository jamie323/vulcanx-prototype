const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
const el = (tag, attrs={}, ...children) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(n.style, v);
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) n.setAttribute(k,'');
    else n.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
};
const uniq = arr => [...new Set(arr.filter(x => x !== '' && x != null))];
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const highlight = (text, q) => {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'ig');
  return safe.replace(re, '<mark>$1</mark>');
};

/* ---------- persistence ---------- */
function loadProgress() { try { const raw = localStorage.getItem('vulcanx.progress.v1'); return raw ? JSON.parse(raw) : {}; } catch { return {}; } }
function saveProgress() { try { localStorage.setItem('vulcanx.progress.v1', JSON.stringify(state.progress)); } catch {} }
function loadPass() { try { return localStorage.getItem('vulcanx.pass.v1') === '1'; } catch { return false; } }
function savePass() { try { localStorage.setItem('vulcanx.pass.v1', state.hasPass ? '1' : '0'); } catch {} }
function loadNumber(key) { try { return +(localStorage.getItem(key) || 0) || 0; } catch { return 0; } }
function saveRewards() {
  try {
    localStorage.setItem('vulcanx.openedChests.v1', String(state.openedChests));
    localStorage.setItem('vulcanx.shards.v1', String(state.shards));
  } catch {}
}

function isComplete(q) { return !!(state.progress[q._id] && state.progress[q._id].complete); }

function attemptComplete(q) {
  // If already complete, toggle off (always allowed)
  if (isComplete(q)) {
    delete state.progress[q._id];
    saveProgress();
    announce(`Unmarked ${q.name}`);
    render();
    return;
  }
  // Gate on pass
  if (!state.hasPass) {
    toast({
      icon: '🎟️',
      title: 'Frenzy Pass required',
      body: `You need an active Frenzy Pass to claim chests on "${q.name}".`,
      action: { label: 'Buy a Pass', onClick: () => { state.modal = 'buy-pass'; dismissAllToasts(); render(); } },
      tone: 'warn'
    });
    announce('Frenzy Pass required to claim this quest');
    return;
  }
  state.progress[q._id] = { complete: true, at: Date.now() };
  saveProgress();
  announce(`Claimed ${q.chests || 0} chest${q.chests===1?'':'s'} from ${q.name}`);
  toast({ icon:'✅', title:'Chest claimed', body:`${q.name} added ${q.chests || 0} chest${q.chests===1?'':'s'} to your stash.`, tone:'success', ttl:3500 });
  fireConfetti();
  render();
}

function openChestMock() {
  const r = rewardSummary();
  if (!state.hasPass) {
    state.modal = 'buy-pass';
    render();
    return;
  }
  if (r.unopened <= 0) {
    toast({ icon:'🧰', title:'No unopened chests', body:'Claim a quest chest first, then open it here.', tone:'warn' });
    return;
  }
  const shardRolls = [420, 640, 780, 920, 1250, 1600, 2400];
  const nftHit = ((state.openedChests + r.claimed) % 5 === 4);
  const outcome = nftHit
    ? { type: 'NFT', title: 'Molten Champion Cosmetic', sub: 'Cosmetic reward added to inventory' }
    : { type: 'SHARDS', amount: shardRolls[(state.openedChests + r.claimed) % shardRolls.length] };
  state.openedChests += 1;
  if (outcome.type === 'SHARDS') state.shards += outcome.amount;
  state.lastReveal = outcome;
  saveRewards();
  fireConfetti();
  announce(outcome.type === 'SHARDS' ? `Chest opened for ${outcome.amount} shards` : `Chest opened for ${outcome.title}`);
  render();
}

function buyPass() {
  state.hasPass = true;
  savePass();
  state.modal = null;
  fireConfetti();
  toast({ icon:'✅', title:'Frenzy Pass activated', body:'You can now claim chests on any quest.', tone:'success' });
  announce('Frenzy Pass activated');
  render();
}

function sellPass() {
  if (!confirm('Deactivate Frenzy Pass? (For testing — clears the pass from your browser.)')) return;
  state.hasPass = false;
  savePass();
  render();
}

function resetProgress() {
  if (!confirm('Reset all quest progress? Clears what is stored in your browser.')) return;
  state.progress = {};
  state.openedChests = 0;
  state.shards = 0;
  saveProgress();
  saveRewards();
  render();
  announce('Progress reset');
}

/* ---------- URL sync ---------- */
function updateUrl() {
  const u = new URL(location.href);
  const p = u.searchParams;
  ['q','game','cadence','type','difficulty','owner','status','cmin','cmax','sort','dir','view','c'].forEach(k => p.delete(k));
  if (state.search) p.set('q', state.search);
  for (const k of ['game','cadence','type','difficulty','owner','status']) {
    if (state.filters[k].size) p.set(k, [...state.filters[k]].join(','));
  }
  const maxC = Math.max(10, ...state.quests.map(q => +q.chests||0));
  if (state.chestMin !== 0) p.set('cmin', state.chestMin);
  if (state.chestMax !== maxC) p.set('cmax', state.chestMax);
  if (state.sortBy !== 'game') p.set('sort', state.sortBy);
  if (state.sortDir !== 'asc') p.set('dir', state.sortDir);
  if (state.view !== 'cards') p.set('view', state.view);
  if (state.completedFilter !== 'all') p.set('c', state.completedFilter);
  if (state.teamMode) p.set('team','1'); else p.delete('team');
  history.replaceState(null, '', u.toString());
}

/* ---------- filtering ---------- */
function filteredQuests() {
  const q = state.search.trim().toLowerCase();
  return state.quests.filter(row => {
    for (const key of ['game','cadence','type','difficulty','owner','status']) {
      const set = state.filters[key];
      if (set.size && !set.has(row[key])) return false;
    }
    if ((row.chests || 0) < state.chestMin || (row.chests || 0) > state.chestMax) return false;
    if (state.completedFilter === 'complete' && !isComplete(row)) return false;
    if (state.completedFilter === 'incomplete' && isComplete(row)) return false;
    if (q) {
      const hay = [row.name, row.what, row.why, row.notes, row.game, gameLabel(row.game), row.type, row.cadence, row.difficulty, row.owner, row.dependencies].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    const dir = state.sortDir === 'asc' ? 1 : -1;
    const sb = state.sortBy;
    let av = a[sb], bv = b[sb];
    if (sb === 'difficulty') { av = DIFFICULTY_RANK[av]||0; bv = DIFFICULTY_RANK[bv]||0; }
    if (sb === 'chests')     { av = +av||0; bv = +bv||0; }
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return -1*dir;
    if (av > bv) return  1*dir;
    return 0;
  });
}

/* ---------- confetti ---------- */
function fireConfetti() {
  try { if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch {}
  const colors = ['#f97316','#fbbf24','#22c55e','#ef4444','#a855f7','#0ea5e9'];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.background = colors[i % colors.length];
    d.style.setProperty('--dx', (Math.random()*400-200) + 'px');
    d.style.setProperty('--dy', (Math.random()*-400-40) + 'px');
    d.style.top = '50%';
    d.style.left = (40 + Math.random()*20) + '%';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1000);
  }
}

/* ---------- toasts ---------- */
function toast({ icon='', title, body, action, tone='info', ttl=6000 }) {
  const stack = $('#toast-stack');
  if (!stack) return;
  const toneRing = { info:'ring-white/10', warn:'ring-amber-500/40', error:'ring-red-500/40', success:'ring-emerald-500/40' }[tone] || 'ring-white/10';
  const toneBg   = { info:'bg-[#141821]', warn:'bg-amber-950/80', error:'bg-red-950/80', success:'bg-emerald-950/80' }[tone] || 'bg-[#141821]';
  const t = el('div', {
    class: `pointer-events-auto max-w-sm rounded-xl ${toneBg} ring-1 ${toneRing} shadow-2xl shadow-black/40 px-4 py-3 fade-in`,
    role: tone === 'warn' || tone === 'error' ? 'alert' : 'status'
  },
    el('div', { class: 'flex items-start gap-3' },
      icon ? el('div', { class: 'text-xl leading-none pt-0.5' }, icon) : null,
      el('div', { class: 'flex-1 min-w-0' },
        title ? el('div', { class: 'text-sm font-bold' }, title) : null,
        body ? el('div', { class: 'text-xs text-slate-300 mt-0.5' }, body) : null,
        action ? el('button', {
          class: 'mt-2 px-3 py-1 rounded-lg bg-forge-500 text-black text-xs font-bold hover:bg-forge-400',
          onclick: () => { t.remove(); action.onClick(); }
        }, action.label) : null
      ),
      el('button', {
        class: 'text-slate-500 hover:text-white text-sm shrink-0',
        'aria-label': 'Dismiss',
        onclick: () => t.remove()
      }, '✕')
    )
  );
  stack.appendChild(t);
  if (ttl) setTimeout(() => t.remove(), ttl);
}
function dismissAllToasts() { const s = $('#toast-stack'); if (s) s.innerHTML = ''; }

/* ---------- rendering ---------- */
function render() {
  document.documentElement.classList.add('dark');
  const root = $('#app');
  root.innerHTML = '';
  root.appendChild(buildShell());
  if (state.modal) root.appendChild(buildModal());
  if (state.selected != null) root.appendChild(buildDetailPanel());
}

function buildShell() {
  const shell = el('div', { class: 'min-h-screen flex flex-col' });
  shell.appendChild(buildRewardOverview());
  shell.appendChild(buildControlRow());
  const main = el('div', { class: 'quest-main-layout' });
  main.appendChild(buildSidebar());
  main.appendChild(buildResults());
  shell.appendChild(main);
  shell.appendChild(buildFooter());
  return shell;
}

  const done = state.quests.filter(q => isComplete(q));

function rewardSummary() {

    claimed: yours.chests,
    unopened,
    opened: state.openedChests,
    shards: state.shards,
    projectedShare,
    pool: 12000,
    reset: '2d 14h',

function activeFilterChips() {
  const chips = [];
  for (const k of ['game','cadence','type','difficulty','owner','status']) {
    for (const v of state.filters[k]) {
      chips.push(el('button', {
        class: 'chip px-2 py-1 rounded-full text-xs bg-forge-500/20 text-forge-200 ring-1 ring-forge-500/40 hover:bg-forge-500/30',
        onclick: () => { state.filters[k].delete(v); updateUrl(); render(); }
      }, `${k==='game'?gameLabel(v):v} ✕`));
    }
  }
  const maxC = Math.max(10, ...state.quests.map(q => +q.chests||0));
  if (state.chestMin !== 0 || state.chestMax !== maxC) {
    chips.push(el('button', {
      class: 'chip px-2 py-1 rounded-full text-xs bg-amber-500/20 text-amber-200 ring-1 ring-amber-500/40',
      onclick: () => { state.chestMin = 0; state.chestMax = maxC; updateUrl(); render(); }
    }, `chests: ${state.chestMin}–${state.chestMax} ✕`));
  }
  if (!chips.length) return null;
  chips.push(el('button', { class: 'chip px-2 py-1 rounded-full text-xs text-slate-400 hover:text-white underline underline-offset-2', onclick: clearAllFilters }, 'clear'));
  return el('div', { class: 'flex flex-wrap gap-1.5 items-center' }, chips);
}

function clearAllFilters() {
  state.filters = defaultFacets();
  const maxC = Math.max(10, ...state.quests.map(q => +q.chests||0));
  state.chestMin = 0; state.chestMax = maxC;
  state.search = ''; state.completedFilter = 'all';
  updateUrl(); render();

  );

  side.appendChild(facetBlock('Game', 'game', gameLabel));
  side.appendChild(facetBlock('Cadence', 'cadence'));
  side.appendChild(facetBlock('Quest type', 'type'));
  side.appendChild(facetBlock('Difficulty', 'difficulty'));
  if (state.teamMode) {
    side.appendChild(facetBlock('Owner', 'owner'));
    side.appendChild(facetBlock('Status', 'status'));
  }
  side.appendChild(chestBlock);

  return side;
}

function perGameProgressBlock() {
  const byGame = {};
  for (const q of state.quests) {
    const g = q.game;
    byGame[g] = byGame[g] || { total:0, done:0, chests:0, chestsEarned:0 };
    byGame[g].total++;
    byGame[g].chests += (+q.chests||0);
    if (isComplete(q)) { byGame[g].done++; byGame[g].chestsEarned += (+q.chests||0); }
  }
  return el('details', { class: 'rounded-xl bg-white/5 ring-1 ring-white/10 overflow-hidden', open: true },
    el('summary', { class: 'flex items-center justify-between px-3 py-2.5 text-sm font-semibold hover:bg-white/5' },
      el('span', {}, '🎯 Your progress'),
      el('span', { class: 'text-xs text-slate-400' }, `${Object.values(state.progress).length}/${state.quests.length}`)
    ),
    el('div', { class: 'p-2 space-y-1.5' },
      FACETS.game.map(g => {
        const s = byGame[g];
        const pct = s.total ? Math.round((s.done/s.total)*100) : 0;
        const gc = gameColor(g);
        return el('button', {
          class: 'w-full text-left px-2 py-1.5 rounded-lg hover:bg-white/5 transition',
          onclick: () => { state.filters.game = new Set([g]); updateUrl(); render(); }
        },
          el('div', { class: 'flex items-center gap-2 mb-1' },
            el('span', { class: `inline-block w-2 h-2 rounded-full ${gc.dot}` }),
            el('span', { class: 'text-xs font-semibold flex-1 truncate' }, gameLabel(g)),
            el('span', { class: 'text-[10px] text-slate-500 tabular-nums' }, `${s.done}/${s.total}`)
          ),
          el('div', { class: 'bar' }, el('span', { class: pct === 100 ? 'bar-done' : 'bar-progress', style: { width: pct + '%' } }))
        );
      })
    )
  );
}

/* ---------- results area ---------- */
function buildResults() {
  const rows = filteredQuests();
  const wrap = el('section', { class: 'quest-results', id: 'quest-board' });

  wrap.appendChild(el('div', { class: 'flex items-center justify-between mb-3' },
    el('h2', { class: 'text-lg font-extrabold' }, 'Quest Board'),
    el('span', { class: 'text-xs text-slate-500 uppercase tracking-[0.2em]' }, `Showing ${rows.length} quest${rows.length===1?'':'s'}`)
  ));

  if (!rows.length) {
    wrap.appendChild(el('div', { class: 'rounded-2xl bg-white/5 ring-1 ring-white/10 p-10 text-center text-slate-400' },
      el('div', { class: 'text-5xl mb-3' }, '🫥'),
      el('div', { class: 'text-lg font-semibold mb-1' }, 'No quests match your filters'),
      el('div', { class: 'text-sm mb-4' }, 'Try clearing a filter or searching something different.'),
      el('button', { class: 'px-4 py-2 rounded-lg bg-forge-500 text-black hover:bg-forge-400 font-medium', onclick: clearAllFilters }, 'Clear all filters')
    ));
    return wrap;
  }
  wrap.appendChild(state.view === 'cards' ? buildCardGrid(rows) : buildTable(rows));
  return wrap;
}

function buildCardGrid(rows) {
  const grid = el('div', { class: 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 fade-in', role:'list' });
  for (const q of rows) grid.appendChild(buildCard(q));
  return grid;
}

function buildCard(q) {
  const gc = gameColor(q.game);
  const diff = DIFF_CLR[q.difficulty] || 'bg-slate-500/15 text-slate-400 ring-slate-500/30';
  const chestPips = Math.max(1, Math.min(+q.chests || 1, 10));
  const done = isComplete(q);
  const pct = done ? 100 : 0;
  const needsPass = !done && !state.hasPass;
  const statusText = done ? 'Chest claimed' : (needsPass ? 'Pass locked' : 'Criteria met');

  return el('article', {
      role: 'listitem',
      class: `group rounded-xl bg-white/5 ring-1 ring-white/10 p-4 hover:ring-forge-500/40 hover:bg-white/10 transition cursor-pointer flex flex-col gap-2 ${done ? 'opacity-80' : ''}`,
      tabindex: 0,
      'aria-label': `${q.name} (${gameLabel(q.game)}, ${q.chests||0} chests, ${done?'completed':(needsPass?'locked, needs pass':'not started')})`,
      onclick: () => { state.selected = q._idx; render(); },
      onkeydown: (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); state.selected = q._idx; render(); } }
    },
    el('div', { class: 'flex items-start justify-between gap-2' },
      el('div', { class: `px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md ${gc.bg} ${gc.text} ring-1 ${gc.ring}` }, gameLabel(q.game)),
      el('div', { class: 'flex items-center gap-1 text-amber-300', title: `${q.chests} chest${q.chests===1?'':'s'}` },
        ...Array.from({length: chestPips}, () => chestIcon('text-[11px]'))
      )
    ),
    el('h3', { class: 'text-base font-bold leading-snug', html: highlight(q.name, state.search) }),
    el('p', { class: 'text-sm text-slate-300 line-clamp-2', html: highlight(q.what || '', state.search) }),
    el('div', { class: 'flex flex-wrap gap-1.5 mt-auto pt-2' },
      q.cadence ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-white/5 ring-1 ring-white/10' }, q.cadence) : null,
      q.difficulty ? el('span', { class: `px-2 py-0.5 text-[11px] rounded-md ring-1 ${diff}` }, q.difficulty) : null,
      done ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30' }, '✓ Done') : null,
      needsPass ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-amber-500/15 text-amber-300 ring-1 ring-amber-500/30' }, '🔒 Pass required') : null,
    ),
    el('div', { class: 'pt-1' },
      el('div', { class: 'flex items-center justify-between text-[10px] text-slate-500 mb-1' },
        el('span', {}, 'Progress'),
        el('span', { class: 'font-semibold ' + (done ? 'text-emerald-300' : (needsPass ? 'text-amber-300' : 'text-forge-300')) }, statusText)
      ),
      el('div', { class: 'bar' + (needsPass && !done ? ' grad-lock' : '') }, el('span', { class: pct === 100 ? 'bar-done' : 'bar-progress', style: { width: pct + '%' } }))
    ),
    el('div', { class: 'flex items-center gap-1.5 pt-1' },
      needsPass
        ? el('button', {
            class: 'flex-1 px-2.5 py-1.5 rounded-lg text-xs font-bold bg-amber-500/15 text-amber-200 ring-1 ring-amber-500/40 hover:bg-amber-500/25',
            onclick: (e) => { e.stopPropagation(); state.modal = 'buy-pass'; render(); }
          }, '🎟️ Buy Pass')
        : el('button', {
            class: `flex-1 px-2.5 py-1.5 rounded-lg text-xs font-bold ${done ? 'bg-emerald-500/20 text-emerald-200 ring-1 ring-emerald-500/40 hover:bg-emerald-500/30' : 'bg-forge-500 text-black hover:bg-forge-400'}`,
            onclick: (e) => { e.stopPropagation(); attemptComplete(q); }
          }, done ? '✓ Claimed' : 'Claim Chest'),
      el('button', {
        class: 'px-2.5 py-1.5 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10 text-xs font-semibold',
        onclick: (e) => { e.stopPropagation(); state.selected = q._idx; render(); }
      }, 'Details')
    )
  );
}

function buildTable(rows) {
  const cols = [
    { key: 'game', label: 'Game' },
    { key: 'name', label: 'Quest' },
    { key: 'chests', label: 'Chests' },
    { key: 'cadence', label: 'Cadence' },
    { key: 'difficulty', label: 'Difficulty' },
    { key: 'type', label: 'Type' },
    { key: '_done', label: 'Status' },
  ];
  const thead = el('thead', { class: 'text-left text-xs uppercase tracking-wider text-slate-400 sticky top-0 bg-[#0b0d12]/90 backdrop-blur z-10' },
    el('tr', {}, cols.map(c => el('th', {
      class: 'px-3 py-2.5 cursor-pointer select-none hover:text-white',
      onclick: () => {
        if (c.key.startsWith('_')) return;
        if (state.sortBy === c.key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        else { state.sortBy = c.key; state.sortDir = 'asc'; }
        updateUrl(); render();
      }
    }, c.label + (state.sortBy === c.key ? (state.sortDir === 'asc' ? ' ↑' : ' ↓') : ''))))
  );
  const tbody = el('tbody', { class: 'divide-y divide-white/5' },
    rows.map(q => {
      const gc = gameColor(q.game);
      const diff = DIFF_CLR[q.difficulty] || 'bg-slate-500/15 text-slate-400 ring-slate-500/30';
      const done = isComplete(q);
      const needsPass = !done && !state.hasPass;
      return el('tr', { class: `hover:bg-white/5 cursor-pointer ${done ? 'opacity-70' : ''}`, onclick: () => { state.selected = q._idx; render(); } },
        el('td', { class: 'px-3 py-2' }, el('span', { class: `px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md ${gc.bg} ${gc.text} ring-1 ${gc.ring}` }, gameLabel(q.game))),
        el('td', { class: 'px-3 py-2 font-semibold', html: highlight(q.name, state.search) }),
        el('td', { class: 'px-3 py-2 text-amber-300' }, chestText(q.chests || 0)),
        el('td', { class: 'px-3 py-2 text-slate-300' }, q.cadence || ''),
        el('td', { class: 'px-3 py-2' }, q.difficulty ? el('span', { class: `px-2 py-0.5 text-[11px] rounded-md ring-1 ${diff}` }, q.difficulty) : ''),
        el('td', { class: 'px-3 py-2 text-slate-300' }, q.type || ''),
        el('td', { class: 'px-3 py-2' }, done
          ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-emerald-500/15 text-emerald-300 ring-1 ring-emerald-500/30' }, '✓')
          : needsPass
            ? el('button', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-amber-500/20 text-amber-200 font-bold ring-1 ring-amber-500/40', onclick: (e) => { e.stopPropagation(); state.modal = 'buy-pass'; render(); } }, '🔒 Pass')
            : el('button', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-forge-500 text-black font-bold', onclick: (e) => { e.stopPropagation(); attemptComplete(q); } }, 'Claim'))
      );
    })
  );
  return el('div', { class: 'rounded-2xl bg-white/5 ring-1 ring-white/10 overflow-hidden fade-in' },
    el('div', { class: 'overflow-auto max-h-[calc(100vh-300px)] scrollbar' },
      el('table', { class: 'w-full text-sm' }, thead, tbody)
    )
  );
}

/* ---------- detail panel ---------- */
function buildDetailPanel() {
  const q = state.quests[state.selected];
  if (!q) return null;
  const gc = gameColor(q.game);
  const diff = DIFF_CLR[q.difficulty] || 'bg-slate-500/15 text-slate-400 ring-slate-500/30';
  const done = isComplete(q);
  const needsPass = !done && !state.hasPass;
  const close = () => { state.selected = null; render(); };

  const rows = filteredQuests();
  const idxInFiltered = rows.findIndex(r => r._idx === q._idx);
  const go = (delta) => {
    if (!rows.length) return;
    const next = (idxInFiltered + delta + rows.length) % rows.length;
    state.selected = rows[next]._idx; render();
  };

  const field = (label, value) => value ? el('div', { class: 'py-2' },
    el('div', { class: 'text-[10px] uppercase tracking-widest text-slate-400 mb-1' }, label),
    el('div', { class: 'text-sm text-slate-100 whitespace-pre-wrap leading-relaxed' }, value)
  ) : null;

  const overlay = el('div', {
    class: 'fixed inset-0 z-40 flex justify-end',
    onclick: (e) => { if (e.target === overlay) close(); },
    role: 'dialog', 'aria-modal': 'true', 'aria-label': q.name
  });
  overlay.appendChild(el('div', { class: 'absolute inset-0 bg-black/60 backdrop-blur-sm' }));

  const panel = el('aside', { class: 'relative z-10 panel-enter w-full sm:max-w-xl h-full bg-[#0f131a] ring-1 ring-white/10 overflow-y-auto scrollbar flex flex-col' },
    el('div', { class: 'sticky top-0 bg-[#0f131a]/95 backdrop-blur border-b border-white/10 px-5 py-4 flex items-center gap-2' },
      el('div', { class: `px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md ${gc.bg} ${gc.text} ring-1 ${gc.ring}` }, gameLabel(q.game)),
      el('div', { class: 'ml-auto flex items-center gap-1 text-xs text-slate-400' },
        el('button', { class: 'w-8 h-8 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10', 'aria-label':'Previous', title:'Previous (←)', onclick: () => go(-1) }, '←'),
        el('span', { class: 'tabular-nums px-1' }, `${idxInFiltered+1}/${rows.length}`),
        el('button', { class: 'w-8 h-8 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10', 'aria-label':'Next', title:'Next (→)', onclick: () => go(1) }, '→'),
      ),
      el('button', { class: 'w-8 h-8 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10 text-slate-300 ml-1', 'aria-label':'Close', title:'Close (Esc)', onclick: close }, '✕')
    ),
    el('div', { class: 'px-5 py-4' },
      el('h2', { class: 'text-2xl font-extrabold leading-tight mb-3' }, q.name),
      el('div', { class: 'flex flex-wrap gap-1.5 mb-3' },
        q.cadence ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-white/5 ring-1 ring-white/10' }, q.cadence) : null,
        q.difficulty ? el('span', { class: `px-2 py-0.5 text-[11px] rounded-md ring-1 ${diff}` }, q.difficulty) : null,
        q.type ? el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-white/5 ring-1 ring-white/10 text-slate-300' }, q.type) : null,
        el('span', { class: 'px-2 py-0.5 text-[11px] rounded-md bg-amber-500/15 text-amber-300 ring-1 ring-amber-500/30 inline-flex items-center gap-1', html: CHEST_SVG + `<span>${q.chests||0} chest${q.chests===1?'':'s'}</span>` })
      ),
      el('div', { class: 'rounded-xl bg-white/5 ring-1 ring-white/10 p-4 mb-2' },
        el('div', { class: 'flex items-center justify-between mb-2' },
          el('div', { class: 'text-xs font-bold uppercase tracking-widest text-slate-400' }, 'Your progress'),
          el('div', { class: 'text-sm font-bold ' + (done ? 'text-emerald-300' : (needsPass ? 'text-amber-300' : 'text-forge-300')) }, done ? 'Chest claimed' : (needsPass ? 'Locked — Pass required' : 'Criteria met'))
        ),
        el('div', { class: 'bar mb-3' + (needsPass && !done ? ' grad-lock' : '') }, el('span', { class: done ? 'bar-done' : 'bar-progress', style: { width: (done?100:0) + '%' } })),
        el('div', { class: 'flex gap-2' },
          needsPass
            ? el('button', { class: 'flex-1 px-3 py-2 rounded-lg text-sm font-bold bg-amber-500/20 text-amber-200 ring-1 ring-amber-500/40 hover:bg-amber-500/30', onclick: () => { state.modal = 'buy-pass'; render(); } }, '🎟️ Buy Frenzy Pass to claim')
            : el('button', {
                class: `flex-1 px-3 py-2 rounded-lg text-sm font-bold inline-flex items-center justify-center gap-1.5 ${done ? 'bg-emerald-500/20 text-emerald-200 ring-1 ring-emerald-500/40' : 'bg-forge-500 text-black hover:bg-forge-400'}`,
                onclick: () => attemptComplete(q),
                html: done ? '✓ Claimed · tap to undo' : ('Claim Chest · ' + CHEST_SVG + ' <span class="tabular-nums">' + (q.chests||0) + '</span>')
              }),
          el('button', {
            class: 'px-3 py-2 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10 text-sm font-semibold',
            onclick: () => shareQuest(q), title:'Copy share link'
          }, '↗ Share')
        )
      ),
      field('What the player does', q.what),
      field('Why it matters', q.why),
      field('Dependencies / unlocks', q.dependencies),
      state.teamMode ? field('Notes (team)', q.notes) : null,
      state.teamMode ? field('Owner (team)', q.owner) : null,
      state.teamMode ? field('Status (team)', q.status) : null,
    ),
    el('div', { class: 'mt-auto px-5 py-3 border-t border-white/10 text-[11px] text-slate-500 flex justify-between' },
      el('div', {}, 'Shortcut: ', el('kbd', {}, 'C'), ' claim · ', el('kbd', {}, '←'), ' ', el('kbd', {}, '→'), ' navigate'),
      el('div', {}, `#${q._id}`)
    )
  );
  overlay.appendChild(panel);
  return overlay;
}

function shareQuest(q) {
  const u = new URL(location.href);
  u.search = '';
  u.searchParams.set('q', q.name);
  u.hash = '';
  navigator.clipboard?.writeText(u.toString());
  toast({ icon:'🔗', title:'Link copied', body:'Share this view with teammates.', tone:'success', ttl:3000 });
}

/* ---------- MODAL (Info + Buy Pass) ---------- */
function buildModal() {
  const close = () => { state.modal = null; render(); };
  const overlay = el('div', {
    class: 'fixed inset-0 z-50 flex items-center justify-center p-4',
    role: 'dialog', 'aria-modal': 'true',
    onclick: (e) => { if (e.target === overlay) close(); }
  });
  overlay.appendChild(el('div', { class: 'absolute inset-0 bg-black/70 backdrop-blur-sm' }));

  const body = state.modal === 'buy-pass'
    ? buildBuyPassModalBody(close)
    : state.modal === 'open-chest'
      ? buildOpenChestModalBody(close)
      : buildInfoModalBody(close);
  overlay.appendChild(body);
  // Esc
  const onKey = (e) => { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onKey); } };
  document.addEventListener('keydown', onKey);
  return overlay;
}

function buildInfoModalBody(close) {
  const tab = (id, label) => el('button', {
    class: 'px-3 py-2 text-sm font-bold border-b-2 ' + (state.infoTab === id ? 'border-forge-500 text-forge-300' : 'border-transparent text-slate-400 hover:text-white'),
    'aria-selected': state.infoTab === id,
    role: 'tab',
    onclick: () => { state.infoTab = id; render(); }
  }, label);
  let tabBody;
  if (state.infoTab === 'how') tabBody = infoTabHow();
  else if (state.infoTab === 'pass') tabBody = infoTabPass();
  else tabBody = infoTabHistory();

  return el('div', { class: 'relative z-10 modal-enter w-full max-w-2xl max-h-[85vh] rounded-2xl bg-[#0f131a] ring-1 ring-white/10 overflow-hidden flex flex-col shadow-2xl' },
    el('div', { class: 'px-5 py-3 border-b border-white/10 flex items-center justify-between' },
      el('div', { class: 'flex items-center gap-3' },
        el('h2', { class: 'text-base font-extrabold' }, 'Info')
      ),
      el('button', { class: 'w-8 h-8 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10 text-slate-300', 'aria-label':'Close', onclick: close }, '✕')
    ),
    el('div', { class: 'flex items-center gap-0 border-b border-white/10 px-3', role:'tablist' },
      tab('how','How it works'),
      tab('pass','Frenzy Pass'),
      tab('history','My chest history')
    ),
    el('div', { class: 'p-5 overflow-auto scrollbar' }, tabBody)
  );
}

      el('div', { class: 'font-bold text-slate-300 mb-1' }, 'Pro tips'),

        el('div', { class: 'text-lg font-extrabold text-white' }, 'Frenzy Pass'),

      )
    ),
    el('ul', { class: 'list-disc list-inside space-y-1 text-slate-300' },
      el('li', {}, 'Unlocks every quest across all six games.'),

      el('li', {}, 'Required to participate in weekly rank climbs.'),
      el('li', {}, 'One pass per seasonal event.'),
    ),
    el('div', { class: 'flex gap-2 pt-1' },
      state.hasPass
        ? el('button', { class: 'px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 ring-1 ring-white/10 text-xs font-semibold', onclick: sellPass }, '× Deactivate (testing)')
        : el('button', { class: 'px-4 py-2 rounded-lg bg-forge-500 hover:bg-forge-400 text-black text-sm font-black', onclick: buyPass }, '🎟️ Buy Frenzy Pass')
    ),
    el('div', { class: 'text-xs text-slate-500 pt-2 border-t border-white/10' },
      'This prototype simulates the pass locally. In production, "Buy" would connect to your commerce flow and persist the pass to your backend / wallet.'
    )
  );
}

function infoTabHistory() {
  const entries = Object.entries(state.progress)
    .map(([id, v]) => {
      const q = state.quests.find(x => x._id === id);
      return q ? { q, at: v.at } : null;
    })
    .filter(Boolean)
    .sort((a,b) => b.at - a.at);
  const totals = entries.reduce((s, e) => s + (+e.q.chests||0), 0);
  return el('div', { class: 'space-y-3' },
    el('div', { class: 'flex items-center gap-3 pb-2 border-b border-white/10' },
      el('div', { class: 'text-3xl text-amber-300', html: CHEST_SVG.replace('width="1em" height="1em"', 'width="1em" height="1em"') }),
      el('div', {},
        el('div', { class: 'text-2xl font-extrabold text-amber-300 tabular-nums' }, String(totals)),
        el('div', { class: 'text-xs text-slate-400' }, 'Chests claimed · ' + entries.length + ' quest' + (entries.length===1?'':'s') + ' completed')
      ),
      el('div', { class: 'ml-auto' },
        entries.length ? el('button', { class: 'px-2.5 py-1.5 rounded-lg bg-white/5 ring-1 ring-white/10 hover:bg-white/10 text-xs text-slate-300', onclick: resetProgress }, '↻ Reset') : null
      )
    ),
    entries.length === 0
      ? el('div', { class: 'text-center py-6 text-slate-500 text-sm' },
          el('div', { class: 'text-3xl mb-2' }, '🗃️'),
          'No chests claimed yet. Claim a quest chest to start your history.'
        )
      : el('ul', { class: 'space-y-1.5' },
          entries.map(({q, at}) => {
            const gc = gameColor(q.game);
            return el('li', {
              class: 'flex items-center gap-3 px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 ring-1 ring-white/10 cursor-pointer transition',
              onclick: () => { state.modal = null; state.selected = q._idx; render(); }
            },
              el('span', { class: `px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md ${gc.bg} ${gc.text} ring-1 ${gc.ring}` }, gameLabel(q.game)),
              el('span', { class: 'text-sm font-semibold truncate flex-1' }, q.name),
              el('span', { class: 'text-xs text-amber-300 tabular-nums inline-flex items-center gap-1', html: '+' + CHEST_SVG + `<span>${q.chests||0}</span>` }),
              el('span', { class: 'text-[10px] text-slate-500 tabular-nums' }, timeAgo(at))
            );
          })
        )
  );
}

function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60); if (h < 24) return `${h}h ago`;
  const d = Math.floor(h/24); if (d < 7) return `${d}d ago`;
  return new Date(ts).toLocaleDateString();
}

function buildOpenChestModalBody(close) {

      el('div', { class: 'text-xs font-bold uppercase tracking-[0.2em] text-amber-200' }, 'My Chests'),
      el('div', { class: 'flex items-end gap-3 mt-1' },
        el('div', { class: 'text-4xl text-amber-300 leading-none', html: CHEST_SVG }),

          el('div', { class: 'text-3xl font-black text-white tabular-nums' }, String(r.unopened)),

      ),
      el('div', { class: 'grid grid-cols-3 gap-2' },
        rewardMini('Unopened', String(r.unopened), 'text-amber-300'),
        rewardMini('Shards', r.shards.toLocaleString(), 'text-sky-300'),
        rewardMini('Pool share', r.projectedShare ? `${r.projectedShare.toFixed(2)}%` : '0%', 'text-forge-300')
      ),
      el('div', { class: 'flex gap-2 pt-1' },
        el('button', {
          class: 'flex-1 px-4 py-3 rounded-xl bg-forge-500 hover:bg-forge-400 disabled:opacity-40 disabled:cursor-not-allowed text-black font-black shadow-lg shadow-forge-900/40',
          disabled: !state.hasPass || r.unopened <= 0,
          onclick: openChestMock
        }, r.unopened > 0 ? 'Open Chest' : 'No Chests'),
        el('button', { class: 'px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 ring-1 ring-white/10 text-slate-200 font-semibold', onclick: close }, 'Close')
      ),
      !state.hasPass ? el('button', { class: 'w-full px-4 py-3 rounded-xl bg-amber-500/15 hover:bg-amber-500/25 ring-1 ring-amber-500/40 text-amber-100 font-bold', onclick: () => { state.modal = 'buy-pass'; render(); } }, 'Buy Frenzy Pass to claim and open') : null
    )
  );
}

function rewardMini(label, value, color) {

function buildBuyPassModalBody(close) {

      ),
      el('ul', { class: 'space-y-1.5 text-sm text-slate-300' },

        el('li', { class: 'flex items-start gap-2' }, el('span', { class:'text-emerald-400' }, '✓'), el('span', {}, 'Open chests into shards or cosmetics')),
        el('li', { class: 'flex items-start gap-2' }, el('span', { class:'text-emerald-400' }, '✓'), el('span', {}, 'Eligible for weekly shard pool and rank bonuses')),
        el('li', { class: 'flex items-start gap-2' }, el('span', { class:'text-emerald-400' }, '✓'), el('span', {}, 'Valid for the full seasonal event')),
      ),

        el('button', { class: 'flex-1 px-4 py-3 rounded-xl bg-forge-500 hover:bg-forge-400 text-black font-black shadow-lg shadow-forge-900/40', onclick: buyPass }, 'Buy Frenzy Pass'),
        el('button', { class: 'px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 ring-1 ring-white/10 text-slate-200 font-semibold', onclick: close }, 'Not now'),

/* ---------- footer ---------- */
function buildFooter() {
  return el('footer', { class: 'border-t border-white/10 mt-auto py-4 text-xs text-slate-500' },
    container(
      el('div', { class: 'flex flex-col sm:flex-row gap-3 justify-between' },
        el('div', {}, `${state.quests.length} quests loaded · progress saved locally · ${BUILD_TAG}`),
        el('div', { class: 'flex flex-wrap gap-4' },
          el('button', { class: 'hover:text-white underline underline-offset-2', onclick: exportCsv }, '⬇ Export CSV'),
          el('button', { class: 'hover:text-white underline underline-offset-2', onclick: () => { navigator.clipboard?.writeText(location.href); toast({ icon:'🔗', title:'Link copied', tone:'success', ttl:2500 }); } }, '🔗 Copy link'),
          el('button', { class: 'hover:text-white underline underline-offset-2', onclick: showShortcuts }, '⌨ Shortcuts'),
        )
      )
    )
  );
}
function showShortcuts() {
  toast({
    icon:'⌨',
    title:'Keyboard shortcuts',
    body:'/ focus search · R random quest · C claim · ← → navigate · Esc close',
    tone:'info',
    ttl:8000
  });
}

function exportCsv() {
  const rows = filteredQuests();
  const cols = ['game','name','what','chests','cadence','type','difficulty','why','dependencies'];
  const header = ['Game/App','Quest Name','What Player Does','Chest Count','Cadence','Quest Type','Difficulty','Why It Matters','Dependencies / Unlocks'];
  const teamCols = state.teamMode ? ['notes','owner','status'] : [];
  const teamHeader = state.teamMode ? ['Notes','Owner','Status'] : [];
  const allCols = [...cols, ...teamCols, 'completed'];
  const allHead = [...header, ...teamHeader, 'Completed'];
  const esc = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const csv = [allHead.join(',')].concat(rows.map(r => allCols.map(c => esc(c === 'completed' ? (isComplete(r) ? 'YES' : '') : r[c])).join(','))).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = `vulcanx-quests-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(u);
}

/* ---------- random quest ---------- */
function pickRandomQuest() {
  const pool = state.quests.filter(q => !isComplete(q));
  if (!pool.length) { toast({ icon:'👑', title:'You\'ve done them all!', tone:'success' }); return; }
  const q = pool[Math.floor(Math.random() * pool.length)];
  state.selected = q._idx; render();
  announce(`Random pick: ${q.name}`);
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', (e) => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input','textarea','select'].includes(tag) && e.key !== 'Escape') return;
  if (e.key === '/') { e.preventDefault(); const s = $('input[type=search]'); if (s) s.focus(); }
  else if (e.key === 'Escape') {
    if (state.modal) { state.modal = null; render(); return; }
    if (state.selected != null) { state.selected = null; render(); }
  }
  else if (state.selected != null && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const rows = filteredQuests();
    if (!rows.length) return;
    const q = state.quests[state.selected];
    const idx = rows.findIndex(r => r._idx === q._idx);
    const next = (idx + (e.key==='ArrowRight'?1:-1) + rows.length) % rows.length;
    state.selected = rows[next]._idx; render();
  }
  else if (state.selected != null && (e.key === 'c' || e.key === 'C')) {
    attemptComplete(state.quests[state.selected]);
  }
  else if (e.key === 'r' || e.key === 'R') { pickRandomQuest(); }
  else if (e.key === '?') { showShortcuts(); }
});

render();
</script>

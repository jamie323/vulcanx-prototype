<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vulcan X - Claude Integrated Prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f39200' d='M3 4l9 16 9-16h-4.5L12 12 7.5 4H3z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="claude-source/tokens.css" />
  <style>
    html, body {
      margin: 0;
      background: #0a0a0d;
      color: #f4f4f6;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      overflow-x: hidden;
      zoom: .92;
    }

    a,
    button {
      cursor: pointer;
    }

    #root {
      min-height: 100vh;
      background: #0a0a0d;
    }

    .vx-app-frame {
      width: min(1600px, 100vw);
      min-height: 100vh;
      margin: 0 auto;
      background: #0a0a0d;
      position: relative;
    }

    .vx {
      width: 100% !important;
      max-width: 1600px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .vx-embedded-quest-frame {
      display: block;
      width: 100%;
      height: calc(100vh - 92px);
      min-height: 780px;
      border: 0;
      background: #0b0d12;
    }

    .vx-ai {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      width: 316px;
      border: 1px solid var(--vx-line-2);
      border-radius: 18px;
      background: rgba(17,17,20,.94);
      backdrop-filter: blur(18px);
      overflow: hidden;
      box-shadow: 0 22px 70px rgba(0,0,0,.5);
    }

    .vx-ai-toggle {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1000;
      border: 1px solid rgba(243,146,0,.45);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--vx-orange), #ffb23a);
      color: #160d00;
      padding: 13px 18px;
      font-weight: 900;
      box-shadow: 0 18px 46px rgba(243,146,0,.28);
    }

    .vx-ai-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 13px 14px;
      border-bottom: 1px solid var(--vx-line);
      font-weight: 800;
    }

    .vx-ai-head button {
      border: 0;
      background: transparent;
      color: var(--vx-text-3);
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      padding: 0 2px;
    }

    .vx-ai-pill {
      border-radius: 999px;
      padding: 5px 8px;
      background: rgba(45,212,122,.12);
      color: var(--vx-green);
      border: 1px solid rgba(45,212,122,.25);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
    }

    .vx-ai-body {
      padding: 13px;
    }

    .vx-ai-body p {
      margin: 0 0 10px;
      color: var(--vx-text-2);
      font-size: 12px;
      line-height: 1.45;
    }

    .vx-ai-body button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      text-align: left;
      color: var(--vx-text);
      background: var(--vx-bg-2);
      border: 1px solid var(--vx-line);
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
    }

    .vx-live-stream {
      display: grid;
      gap: 10px;
      max-height: 286px;
      overflow: hidden;
      mask-image: linear-gradient(180deg, transparent, #000 8%, #000 88%, transparent);
    }

    .vx-live-stream-inner {
      display: grid;
      gap: 10px;
      animation: vxLiveScroll 24s linear infinite;
    }

    .vx-live-stream:hover .vx-live-stream-inner {
      animation-play-state: paused;
    }

    @keyframes vxLiveScroll {
      from { transform: translateY(0); }
      to { transform: translateY(-50%); }
    }

    .vx-launch-strip {
      position: sticky;
      top: 0;
      z-index: 999;
      background: var(--vx-orange);
      color: #1a0f00;
      text-align: center;
      padding: 8px 40px;
      font-size: 12px;
      font-weight: 700;
    }

    .vx-launch-strip button {
      position: absolute;
      right: 12px;
      top: 5px;
      border: 0;
      background: transparent;
      color: #1a0f00;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      body {
        zoom: .46;
      }

      .vx-app-frame,
      .vx {
        width: 1600px !important;
        max-width: none;
        overflow-x: visible;
      }

      .vx-ai {
        display: none;
      }

      .vx-embedded-quest-frame {
        height: calc(100vh - 92px);
        min-height: 900px;
      }
    }

    @media (max-width: 480px) {
      body {
        zoom: .25;
      }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
// Vulcan X — shared atoms used across all page mocks.
// Each artboard inside the design canvas is a self-contained "page" that
// uses these primitives so the variations stay visually coherent.

const { useState, useEffect, useRef, useMemo } = React;

// --- Brand mark ---------------------------------------------------------
function VxLogo({ size = 32 }) {
  return (
    <button
      type="button"
      aria-label="Go to Vulcan X home"
      onClick={() => {
        history.replaceState(null, "", "#home");
        window.dispatchEvent(new HashChangeEvent("hashchange"));
        window.scrollTo(0, 0);
      }}
      style={{ display: "flex", alignItems: "center", gap: 12, background: "transparent", border: 0, color: "#fff", padding: 0, cursor: "pointer" }}
    >
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
        <path d="M3 4l9 16 9-16h-4.5L12 12 7.5 4H3z" fill="#f39200"/>
      </svg>
      <span style={{ fontSize: 22, fontWeight: 900, letterSpacing: "0.01em" }}>
        VulcanX
      </span>
    </button>
  );
}

// --- Top navigation -----------------------------------------------------
// Simplified from the original 9-item nav. Default consolidation:
//   Play · Earn · Trade · Chain · Profile
// `items` lets a variation override the set/active item.
function VxTopNav({
  items = ["Play", "Earn", "Trade", "Chain", "Profile"],
  active = "Play",
  showSearch = false,
  showWallet = true,
  variant = "default", // "default" | "ghost" | "split"
}) {
  const isGhost = variant === "ghost";
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 26,
      padding: "17px 38px",
      borderBottom: isGhost ? "none" : "1px solid var(--vx-line)",
      background: isGhost ? "transparent" : "rgba(10,10,13,0.85)",
      backdropFilter: "blur(8px)",
    }}>
      <VxLogo />
      {showSearch && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          background: "var(--vx-bg-2)", border: "1px solid var(--vx-line)",
          borderRadius: 8, padding: "7px 12px", width: 280,
          color: "var(--vx-text-3)", fontSize: 13,
        }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/>
          </svg>
          <span>Search games, tokens, players…</span>
          <span style={{ marginLeft: "auto", fontSize: 10, padding: "2px 6px", border: "1px solid var(--vx-line-2)", borderRadius: 4 }}>⌘K</span>
        </div>
      )}
      <nav style={{ display: "flex", gap: 8, marginLeft: showSearch ? 10 : 0 }}>
        {items.map((it) => (
          <a key={it} style={{
            position: "relative",
            padding: "11px 16px",
            fontSize: 17, fontWeight: 800,
            color: it === active ? "#fff" : "rgba(255,255,255,.82)",
            borderRadius: 6,
            cursor: "pointer",
          }}>
            {it}
            {it === active && (
              <span style={{
                position: "absolute", left: 14, right: 14, bottom: -15,
                height: 2, background: "var(--vx-orange)",
              }}/>
            )}
          </a>
        ))}
      </nav>
      <div style={{ marginLeft: "auto", display: "flex", gap: 10, alignItems: "center" }}>
        <button style={{ width: 34, height: 34, borderRadius: 8, border: "1px solid var(--vx-line)", display: "grid", placeItems: "center", color: "var(--vx-text-2)" }}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        </button>
        {showWallet && (
          <button className="vx-btn vx-btn-primary" style={{ padding: "10px 16px", fontSize: 15, fontWeight: 900 }}>
            Connect Wallet
          </button>
        )}
      </div>
    </div>
  );
}

// --- Pill / Tag --------------------------------------------------------
function VxTag({ kind, children, style }) {
  const cls = `vx-pill vx-tag-${kind || "berserk"}`;
  return <span className={cls} style={style}>{children}</span>;
}

// --- Game art placeholder (themed strip per game) ----------------------
function VxGameArt({ game = "berserk", height = 160, label }) {
  const palette = {
    berserk:      ["#3a1a0a", "#7a2c08", "#f39200"],
    vulcanverse:  ["#1a1030", "#3a1c66", "#a48bff"],
    runner:       ["#2a0e08", "#6b1f10", "#ff7a3d"],
    champions:    ["#0a1a1f", "#0e3a4d", "#3fc6ff"],
    forge:        ["#1a1a22", "#2a2a36", "#7c5cff"],
    arena:        ["#1f1208", "#5a3008", "#ffd23f"],
  };
  const art = {
    berserk: "https://cdn.vulcanforged.com/web/berserk/images/Berserk-Banner--Design-02.jpg",
    vulcanverse: "https://cdn.vulcanforged.com/web/vulcanforged-revamp/images/vulcan-verse.png",
    runner: "https://cdn.vulcanforged.com/web/vulcanforged-revamp/images/flip_bg_vulcan_runner.png",
    forge: "https://cdn.vulcanforged.com/web/vulcanforged-revamp/images/flip_tower_defense.png",
  };
  const [a, b, c] = palette[game] || palette.berserk;
  return (
    <div style={{
      position: "relative",
      height, width: "100%", borderRadius: 10, overflow: "hidden",
      background: art[game]
        ? `linear-gradient(180deg, rgba(10,10,13,0.05), rgba(10,10,13,0.68)), url('${art[game]}') center/cover no-repeat`
        : `radial-gradient(120% 100% at 80% 20%, ${c}33, transparent 60%), linear-gradient(135deg, ${a}, ${b})`,
    }}>
      {/* faux game art lines */}
      <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: art[game] ? 0.22 : 0.5 }} viewBox="0 0 400 300" preserveAspectRatio="none">
        <defs>
          <linearGradient id={`grad-${game}`} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={c} stopOpacity="0.35"/>
            <stop offset="100%" stopColor={c} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={`M0 ${200 + (game.length * 4)} Q 100 ${120 + game.length} 200 ${180} T 400 ${160}`} stroke={c} strokeWidth="1.2" fill="none" opacity="0.4"/>
        <circle cx="320" cy="80" r="60" fill={`url(#grad-${game})`}/>
        <circle cx="100" cy="220" r="80" fill={`url(#grad-${game})`} opacity="0.5"/>
      </svg>
      {label && (
        <div style={{
          position: "absolute", left: 14, bottom: 12,
          fontFamily: "var(--vx-font-display)",
          fontWeight: 800, fontSize: 22, letterSpacing: "0.02em",
          color: c, textShadow: `0 2px 12px ${a}`,
          textTransform: "uppercase",
        }}>
          {label}
        </div>
      )}
    </div>
  );
}

// --- Stat readout ------------------------------------------------------
function VxStat({ label, value, accent, mono }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <span style={{ fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--vx-text-3)" }}>{label}</span>
      <span style={{
        fontSize: 22, fontWeight: 700,
        color: accent || "var(--vx-text)",
        fontFamily: mono ? "var(--vx-font-mono)" : "var(--vx-font-display)",
        letterSpacing: "-0.02em",
      }}>{value}</span>
    </div>
  );
}

// --- Section title -----------------------------------------------------
function VxSectionTitle({ kicker, title, action }) {
  return (
    <div style={{ display: "flex", alignItems: "flex-end", marginBottom: 14 }}>
      <div>
        {kicker && (
          <div style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--vx-orange)", fontWeight: 600, marginBottom: 4 }}>
            {kicker}
          </div>
        )}
        <h3 style={{ fontSize: 18, fontWeight: 700 }}>{title}</h3>
      </div>
      {action && (
        <a style={{ marginLeft: "auto", fontSize: 12, color: "var(--vx-orange)", fontWeight: 600 }}>{action} →</a>
      )}
    </div>
  );
}

// --- Mini bar / progress ----------------------------------------------
function VxBar({ pct = 50, color = "var(--vx-orange)", track = "var(--vx-line)" }) {
  return (
    <div style={{ position: "relative", height: 6, background: track, borderRadius: 999, overflow: "hidden" }}>
      <div style={{ position: "absolute", inset: 0, right: `${100-pct}%`, background: color }}/>
    </div>
  );
}

// --- Footer (light) ----------------------------------------------------
function VxFooterStats() {
  return (
    <div style={{
      display: "flex", alignItems: "center", gap: 28,
      padding: "16px 32px",
      borderTop: "1px solid var(--vx-line)",
      color: "var(--vx-text-3)", fontSize: 11, fontFamily: "var(--vx-font-mono)",
    }}>
      <span><span style={{ color: "var(--vx-green)" }}>●</span> 3,180 online</span>
      <span>$4.2M 24h volume</span>
      <span>2,841 games today</span>
      <span>47 chests claimed</span>
      <span style={{ marginLeft: "auto" }}>vulcan-x.io · v2.4.1</span>
    </div>
  );
}

// Sample data shared across pages
const VX_GAMES = [
  { id: "berserk", name: "Berserk", tag: "berserk", genre: "Card / Strategy", players: 1247, quests: 3 },
  { id: "vulcanverse", name: "VulcanVerse", tag: "vulcanverse", genre: "MMORPG", players: 412, quests: 4 },
  { id: "runner", name: "Vulcan Runner", tag: "runner", genre: "Endless Runner", players: 678, quests: 2 },
  { id: "champions", name: "Vulcan Champions", tag: "berserk", genre: "Auto-Battler", players: 3104, quests: 5, featured: true },
  { id: "forge", name: "Forge of Olympus", tag: "vulcanverse", genre: "Crafting Sim", players: 92, quests: 1 },
  { id: "arena", name: "Arena Ascent", tag: "runner", genre: "PvP Brawler", players: 834, quests: 2 },
];

const VX_LEADERBOARD = [
  { rank: 1, name: "DragonSlayer99", tag: "berserk", score: "8,420", bonus: "+8" },
  { rank: 2, name: "CryptoKnight", tag: "trader", score: "7,981", bonus: "+8" },
  { rank: 3, name: "ForgeHero", tag: "vulcanverse", score: "6,450", bonus: "+5" },
  { rank: 4, name: "VulcanKing", tag: "berserk", score: "5,712", bonus: "+4" },
  { rank: 5, name: "PyroTrader", tag: "trader", score: "4,901", bonus: "+3" },
  { rank: 6, name: "OlympusFire", tag: "vulcanverse", score: "4,221", bonus: "+3" },
  { rank: 7, name: "ChainRunner", tag: "runner", score: "3,884", bonus: "+2" },
  { rank: 8, name: "AshenBlade", tag: "berserk", score: "3,650", bonus: "+2" },
];

const VX_QUESTS = [
  { id: 1, title: "Win 3 Berserk matches", track: "game", game: "berserk", reward: "Bronze Chest", progress: 2, target: 3 },
  { id: 2, title: "Reach Diamond in any game", track: "rank", reward: "Gold Chest", progress: 0, target: 1 },
  { id: 3, title: "Complete first DEX swap", track: "trade", reward: "Silver Chest", progress: 0, target: 1 },
  { id: 4, title: "Hold a position 7 days", track: "trade", reward: "Bonus +2x", progress: 4, target: 7 },
  { id: 5, title: "Mint a Vulcanverse plot", track: "nft", reward: "VV Crate", progress: 0, target: 1 },
  { id: 6, title: "Daily login streak ×7", track: "daily", reward: "PYR Boost", progress: 5, target: 7 },
];

Object.assign(window, {
  VxLogo, VxTopNav, VxTag, VxGameArt, VxStat, VxSectionTitle, VxBar, VxFooterStats,
  VX_GAMES, VX_LEADERBOARD, VX_QUESTS,
});

</script>

<script type="text/babel">
// Vulcan X — v3 top navigation.
// Product shell for the combined app.
//   Home · Play · Trade · Earn · Social · Chain
// Earn / Social have dropdowns; Profile is a direct link (no dropdown).
//
// Pass `openMenu` to render a dropdown panel below an item.
//   openMenu="earn" | "social" | null

const VX_NAV_ITEMS_V3 = [
  { id: "home",   label: "Home",   href: "home" },
  { id: "play",   label: "Play",   href: "play" },
  { id: "trade",  label: "Trade",  href: "trade" },
  { id: "earn",   label: "Earn",   href: "earn",   menu: [
    { label: "Quests",  desc: "Earn chests from games and ecosystem actions", meta: "Open board" },
    { label: "Staking", desc: "V-Drip · V-Lock · Land", meta: "1.4M PYR locked" },
  ]},
	  { id: "social", label: "Social", href: "social", menu: [
	    { label: "Leaderboards", desc: "Shards + per-game",    meta: "Live" },
	    { label: "Chat",         desc: "Open chat panel",      meta: "418 online" },
	    { label: "Guilds",       desc: "Guild rankings and rooms", meta: "" },
	    { label: "Activity",     desc: "Ecosystem feed",       meta: "" },
	  ]},
  { id: "chain",  label: "Chain",  href: "chain" },
];

function VxIcon({ name, size = 14 }) {
  const stroke = { stroke: "currentColor", strokeWidth: 1.6, fill: "none", strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "search":  return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>;
    case "bell":    return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg>;
    case "chevron": return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M6 9l6 6 6-6"/></svg>;
    case "wallet":  return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 13h2"/><path d="M3 10h18"/></svg>;
    case "chat":    return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M21 15a3 3 0 0 1-3 3H8l-5 4V6a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3z"/></svg>;
    case "spark":   return <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>;
    default: return null;
  }
}

function VxNavV3({
  active = "play",
  openMenu = null,
  showSearch = false,
  profileName = "ashen.eth",
  hasNotifications = false,
}) {
  const [hoverMenu, setHoverMenu] = React.useState(null);
  const visibleMenu = openMenu || hoverMenu;
  const dropdownRoute = (label) => {
    if (label === "Quests") return "quests";
    if (label === "Staking") return "earn";
    return label.toLowerCase();
  };

  return (
    <div style={{
      position: "relative",
      display: "flex", alignItems: "center", gap: 28,
      padding: "18px 42px",
      borderBottom: "1px solid var(--vx-line)",
      background: "rgba(10,10,13,0.92)",
      backdropFilter: "blur(8px)",
      zIndex: 20,
    }}>
      <VxLogo/>
      {showSearch && (
        <div style={{
          display: "flex", alignItems: "center", gap: 8,
          background: "var(--vx-bg-2)", border: "1px solid var(--vx-line)",
          borderRadius: 8, padding: "7px 12px", width: 240,
          color: "var(--vx-text-3)", fontSize: 12,
        }}>
          <VxIcon name="search"/>
          <span style={{ flex: 1 }}>Search games, tokens, players…</span>
          <span style={{ fontSize: 10, padding: "1px 6px", border: "1px solid var(--vx-line-2)", borderRadius: 4 }}>⌘K</span>
        </div>
      )}
      <nav style={{ display: "flex", gap: 10, marginLeft: 10 }}>
        {VX_NAV_ITEMS_V3.map(it => {
          const isActive = it.id === active;
          const isOpen = it.id === visibleMenu;
          return (
            <div
              key={it.id}
              onMouseEnter={() => it.menu && setHoverMenu(it.id)}
              onMouseLeave={() => it.menu && setHoverMenu(null)}
              style={{ position: "relative" }}
            >
              <a
                onClick={(event) => {
                  event.preventDefault();
                  routeWithinPrototype(it.href);
                  setHoverMenu(null);
                }}
                style={{
                position: "relative", display: "inline-flex", alignItems: "center", gap: 5,
                padding: "13px 17px",
                fontSize: 18, fontWeight: 900,
                color: isActive ? "#fff" : "rgba(255,255,255,.86)",
                borderRadius: 9,
                background: isOpen ? "var(--vx-bg-2)" : "transparent",
                cursor: "pointer",
              }}>
                {it.label}
                {it.menu && <span style={{ opacity: isOpen ? 1 : 0.82 }}><VxIcon name="chevron" size={15}/></span>}
                {isActive && (
                  <span style={{ position: "absolute", left: 17, right: 17, bottom: -19, height: 3, background: "var(--vx-orange)", borderRadius: 999 }}/>
                )}
              </a>
              {isOpen && it.menu && (
                <div style={{
                  position: "absolute", top: "calc(100% + 8px)", left: 0,
                  background: "var(--vx-bg-1)", border: "1px solid var(--vx-line-2)",
                  borderRadius: 14, padding: 10, minWidth: 350,

function HexIcon({ name, color, size = 22, weight = 1.8 }) {
  const stroke = { stroke: color, strokeWidth: weight, fill: "none", strokeLinecap: "round", strokeLinejoin: "round" };
  switch (name) {
    case "play":
      return <svg width={size} height={size} viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill={color}/></svg>;
    case "trophy":
      return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M8 4h8v4a4 4 0 0 1-8 0z"/><path d="M6 5H4v2a4 4 0 0 0 4 4"/><path d="M18 5h2v2a4 4 0 0 1-4 4"/><path d="M12 12v5"/><path d="M8 21h8"/><path d="M9 17h6"/></svg>;
    case "chart":
      return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>;
    case "gem":
      return <svg width={size} height={size} viewBox="0 0 24 24" {...stroke}><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M2 9h20"/><path d="M8 9l4 12 4-12"/><path d="M8 3L6 9l6-6 6 6-2-6"/></svg>;
    case "blocks":

function H2Hex({ v, size }) {
  const w = size;
  const h = size * 1.155;
  const amplified = v.verb === "EARN" || v.verb === "TRADE";
  return (
    <div style={{ width: w, height: h, position: "relative", cursor: "pointer", filter: amplified ? `drop-shadow(0 0 24px ${v.color}55)` : "none" }}>
      <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ position: "absolute", inset: 0 }}>
        <polygon points={`${w/2},2 ${w-2},${h*0.27} ${w-2},${h*0.73} ${w/2},${h-2} 2,${h*0.73} 2,${h*0.27}`} fill={amplified ? `${v.color}1f` : "rgba(255,255,255,0.02)"} stroke={v.color} strokeWidth={amplified ? 2.5 : 1.5}/>
      </svg>
      <div style={{ position: "absolute", inset: 0, padding: "30px 24px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center", gap: 10 }}>
        <HexIcon name={v.icon} color={v.color} size={amplified ? 32 : 30} weight={1.6}/>
        {amplified ? (
          <>
            <div style={{ fontSize: 10.5, color: v.color, fontFamily: "var(--vx-font-mono)", letterSpacing: "0.16em", marginTop: -2 }}>· FEATURED ·</div>
            <div style={{ fontSize: 32, fontWeight: 800, color: v.color, letterSpacing: "-0.03em", lineHeight: 1, fontFamily: "var(--vx-font-display)" }}>{v.verb}</div>
            <div style={{ fontSize: 24, fontWeight: 800, color: "#fff", letterSpacing: "-0.025em", lineHeight: 1.05, fontFamily: "var(--vx-font-display)" }}>
              {v.amp.label}
            </div>
            <div style={{ fontSize: 12, color: "rgba(255,255,255,0.78)", lineHeight: 1.3, fontWeight: 500, padding: "0 4px" }}>{v.amp.sub}</div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 36, fontWeight: 800, color: v.color, letterSpacing: "-0.03em", lineHeight: 1, fontFamily: "var(--vx-font-display)", marginTop: 4 }}>{v.verb}</div>
            <div style={{ width: 22, height: 2, background: v.color, opacity: 0.55 }}/>
            <div style={{ fontSize: 14, color: "#fff", lineHeight: 1.3, fontWeight: 500, padding: "0 6px" }}>{v.line}</div>
          </>
        )}
      </div>
    </div>
  );
}

    function QuestsIntegrated() {

            src="quests-v2.html?embedded=1"
          />
        </div>
      );
    }

    const ROUTES = {
      home: { label: "Home", component: HomeHex_H2 },
      play: { label: "Play", component: PlayV1 },
      trade: { label: "Trade", component: TradeV1 },
      earn: { label: "Earn", component: EarnV5 },
      quests: { label: "Quests", component: QuestsIntegrated },
      chain: { label: "Chain", component: ChainV1 },
      social: { label: "Social", component: SocialV1 },
      chat: { label: "Chat", component: SocialV2 },
      guilds: { label: "Guilds", component: SocialV3 },
      activity: { label: "Activity", component: SocialV4 },
      profile: { label: "Profile", component: ProfileV2 },
    };

    function normalizeRoute(value) {
      return ROUTES[value] ? value : "home";
    }

    function patchLegacyLanguage() {
      const replacements = [
        ["XP", "shards"],
        ["Quest XP gain", "Chest progress"],
        ["Frenzy Pass tiers", "weekly chest routes"],
        ["Climb tiers", "Claim chests"],
        ["Silver chest guaranteed", "Chest route unlock"],
      ];

      const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        let text = node.nodeValue;
        replacements.forEach(([from, to]) => {
          text = text.replaceAll(from, to);
        });
        node.nodeValue = text;
      });
    }

    function installClickRouter(setRoute) {
      document.addEventListener("click", event => {
        const text = (event.target?.textContent || "").trim().toLowerCase();

        if (text.includes("quest") || text.includes("open quest board")) {
          setRoute("quests");
          return;
        }

        if (text === "home") setRoute("home");
        if (text === "play" || text.startsWith("play") || text.includes("jump into a game") || text.includes("browse games") || text.includes("open play") || text.includes("join 200k")) setRoute("play");
        if (text === "trade" || text.startsWith("trade") || text.includes("70% back") || text.includes("open dex") || text.includes("preview trade") || text.includes("see markets") || text.includes("open trade") || text.includes("buy with card")) {
          setRoute("trade");
          return;
        }
        if (text === "earn" || text.startsWith("earn") || text.includes("$46k pool") || text.includes("staking") || text.includes("open earn")) setRoute("earn");
        if (text.includes("compare programs")) {
          setRoute("earn");
          setTimeout(() => window.scrollTo({ top: 860, behavior: "smooth" }), 0);
          return;
        }
        if (text === "chain" || text.startsWith("build") || text.includes("bridge") || text.includes("explorer") || text.includes("elysium")) setRoute("chain");
        if (text === "social" || text.startsWith("social") || text.includes("leaderboard") || text.includes("rankings")) setRoute("social");
        if (text.includes("chat")) setRoute("chat");
        if (text.includes("guild")) setRoute("guilds");
        if (text.includes("activity") || text.includes("full feed")) setRoute("activity");
        if (text.includes("profile") || text.includes("ashen.eth")) setRoute("profile");
      }, true);
    }

    function App() {
      const initial = normalizeRoute(location.hash.replace("#", ""));
      const [route, setRouteState] = React.useState(initial);
      const [aiOpen, setAiOpen] = React.useState(false);
      const Current = ROUTES[route].component;

      const setRoute = React.useCallback(next => {
        const normalized = normalizeRoute(next);
        setRouteState(normalized);
        history.replaceState(null, "", `#${normalized}`);
        window.scrollTo(0, 0);
      }, []);

      React.useEffect(() => {
        installClickRouter(setRoute);
      }, [setRoute]);

      React.useEffect(() => {
        const syncRouteFromHash = () => {
          setRouteState(normalizeRoute(location.hash.replace("#", "")));
          window.scrollTo(0, 0);
        };
        window.addEventListener("hashchange", syncRouteFromHash);
        return () => window.removeEventListener("hashchange", syncRouteFromHash);
      }, []);

      React.useEffect(() => {
        const id = requestAnimationFrame(patchLegacyLanguage);
        return () => cancelAnimationFrame(id);
      }, [route]);

      return (
        <>
          <div className="vx-app-frame">
            <Current />
          </div>

          {aiOpen ? (
            <aside className="vx-ai">
              <div className="vx-ai-head">
                <span>Vulcan Guide AI</span>
                <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span className="vx-ai-pill">UI only</span>
                  <button aria-label="Close Vulcan AI Help" onClick={() => setAiOpen(false)}>×</button>

              </div>
              <div className="vx-ai-body">
                <p>Local helper placeholder. It should explain what users can do on this page and how it affects chests, shards, or weekly PYR.</p>

                <button>Fastest route to my next chest?</button>
                <button>How do shards decide weekly PYR?</button>
              </div>
            </aside>
          ) : (
            <button className="vx-ai-toggle" onClick={() => setAiOpen(true)}>Vulcan AI Help</button>
          )}
        </>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vulcan X Fun Chest Reveal</title>
    <style>
      :root {
        --bg: #07070a;
        --panel: #111116;
        --line: #26262e;
        --text: #f7f4ee;
        --muted: #a8a8b0;
        --accent: #f39200;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--accent), transparent 82%), transparent 36%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(1240px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 36px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 6vw, 74px);
        line-height: .92;
        letter-spacing: -.06em;
      }

      .hint {
        max-width: 440px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        font-weight: 700;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 22px;
      }

      .stage {
        position: relative;
        min-height: 720px;
        overflow: hidden;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 58%);
        border-radius: 34px;
        background:
          radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--accent), transparent 74%), transparent 38%),
          linear-gradient(180deg, rgba(255,255,255,.05), transparent),
          #09090d;
      }

      .burst {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 48px;
        height: 48px;
        border-radius: 999px;
        background: var(--accent);
        opacity: 0;
        transform: translate(-50%, -50%) scale(.2);
        filter: blur(1px);
      }

      .stage.revealing .burst {
        animation: burst 900ms ease-out 900ms;
      }

      @keyframes burst {
        0% { opacity: .85; transform: translate(-50%, -50%) scale(.2); box-shadow: 0 0 0 0 var(--accent); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(16); box-shadow: 0 0 90px 40px var(--accent); }
      }

      .chest-wrap {
        position: absolute;
        left: 50%;
        top: 46%;
        width: min(520px, 72vw);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 40px 70px rgba(0,0,0,.7));
      }

      .chest-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 50% 62%;
      }

      .stage.idle .chest-wrap img {
        animation: breathe 2.6s ease-in-out infinite;
      }

      .stage.revealing .chest-wrap img {
        animation: chestPop 1.2s cubic-bezier(.16, .9, .2, 1);
      }

      @keyframes breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.018); }
      }

      @keyframes chestPop {
        0% { transform: translateY(0) scale(1) rotate(0deg); }
        20% { transform: translateY(10px) scale(.96) rotate(-1deg); }
        48% { transform: translateY(-30px) scale(1.08) rotate(1deg); }
        100% { transform: translateY(0) scale(1) rotate(0deg); }
      }

      .reward {
        position: absolute;
        left: 50%;
        bottom: 34px;
        width: min(520px, calc(100% - 48px));
        padding: 24px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 42%);
        border-radius: 24px;
        background: rgba(5,5,8,.72);
        backdrop-filter: blur(18px);
        text-align: center;
        opacity: 0;
        transform: translate(-50%, 24px) scale(.98);
        transition: 520ms cubic-bezier(.16, .9, .2, 1);
      }

      .stage.revealed .reward {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .tier {
        color: var(--accent);
        font-size: 13px;
        font-weight: 950;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      .reward-main {
        margin-top: 8px;
        font-size: clamp(48px, 8vw, 88px);
        font-weight: 1000;
        line-height: .9;
        letter-spacing: -.07em;
      }

      .reward-sub {
        margin-top: 10px;
        color: var(--muted);
        font-weight: 800;
      }

      .nft-card {
        width: 150px;
        aspect-ratio: 1;
        margin: 12px auto 4px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        border: 1px solid color-mix(in srgb, var(--accent), transparent 32%);
        background:
          radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--accent), transparent 55%), transparent 44%),
          #101215;
        color: var(--accent);
        font-size: 36px;
        font-weight: 1000;
        box-shadow: 0 0 46px color-mix(in srgb, var(--accent), transparent 64%);
      }

      .particles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .particle {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--s);
        height: var(--s);
        border-radius: 999px;
        background: var(--accent);
        opacity: 0;
      }

      .stage.revealing .particle {
        animation: particle 1050ms ease-out var(--d);
      }

      @keyframes particle {
        0% { opacity: 1; transform: translate(-50%, -50%) scale(.7); }
        100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0); }
      }

      .controls {
        display: grid;
        gap: 10px;
        align-content: start;
      }

      button {
        min-height: 76px;
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }

      button.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent), transparent 84%);
      }

      button strong {
        display: block;
        font-size: 18px;
      }

      button span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      .open-btn {
        min-height: 58px;
        border-color: var(--accent);
        background: var(--accent);
        color: #080808;
        text-align: center;
        font-size: 17px;
        font-weight: 1000;
      }

      .dev-label {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 950;
        letter-spacing: .14em;
        text-transform: uppercase;
      }

      @media (max-width: 900px) {
        header, .layout { grid-template-columns: 1fr; display: grid; }
        .stage { min-height: 620px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Fun Chest<br />Reveal Kit.</h1>
        </div>
        <p class="hint">
          The unopened chest is always neutral. The actual cache color, tier, shards,
          or NFT only appears after the user clicks Open.
        </p>
      </header>

      <div class="layout">
        <section class="stage idle" id="stage">
          <div class="burst"></div>
          <div class="particles" id="particles"></div>
          <div class="chest-wrap">
            <img id="chest" src="../public/chest-art/mystery-chest.svg" alt="Mystery chest" />
          </div>
          <div class="reward" id="reward"></div>
        </section>
        <aside class="controls" id="controls">
          <button class="open-btn" id="open">Open Chest</button>
        </aside>
      </div>
    </main>

    <script>
      const outcomes = [
        { id: "ember", name: "Ember Cache", accent: "#f39200", file: "../public/chest-art/ember-chest.svg", reward: "+700", sub: "shards" },
        { id: "forge", name: "Forge Cache", accent: "#ffb13d", file: "../public/chest-art/forge-chest.svg", reward: "+1,000", sub: "shards" },
        { id: "titan", name: "Titan Cache", accent: "#4aa8ff", file: "../public/chest-art/titan-chest.svg", reward: "+1,400", sub: "shards" },
        { id: "olympian", name: "Olympian Cache", accent: "#ffd23f", file: "../public/chest-art/olympian-chest.svg", reward: "+2,000", sub: "shards" },
        { id: "mythic", name: "Mythic Cache", accent: "#a48bff", file: "../public/chest-art/mythic-chest.svg", reward: "+3,500", sub: "shards" },
        { id: "relic", name: "Relic Drop", accent: "#2dd47a", file: "../public/chest-art/relic-chest.svg", reward: "NFT", sub: "+500 shards", nft: true },
      ];
      const mystery = {
        name: "Mystery Chest",
        accent: "#f3b33d",
        file: "../public/chest-art/mystery-chest.svg",
      };

      const stage = document.getElementById("stage");
      const chest = document.getElementById("chest");
      const reward = document.getElementById("reward");
      const controls = document.getElementById("controls");
      const particles = document.getElementById("particles");
      let forcedOutcome = null;
      let lastOutcome = null;

      function resetMystery() {
        document.documentElement.style.setProperty("--accent", mystery.accent);
        chest.src = mystery.file;
        chest.alt = mystery.name;
        reward.innerHTML = "";
        stage.classList.remove("revealing", "revealed");
        stage.classList.add("idle");
      }

      function setForcedOutcome(outcome) {
        forcedOutcome = outcome;
        resetMystery();
        [...controls.querySelectorAll("[data-id]")].forEach(button => {
          button.classList.toggle("active", button.dataset.id === (outcome?.id || "random"));
        });
      }

      function renderReward(outcome) {
        reward.innerHTML = outcome.nft
          ? `<div class="tier">${outcome.name}</div><div class="nft-card">NFT</div><div class="reward-sub">${outcome.sub}</div>`
          : `<div class="tier">${outcome.name}</div><div class="reward-main">${outcome.reward}</div><div class="reward-sub">${outcome.sub}</div>`;
      }

      function makeParticles() {
        particles.innerHTML = "";
        for (let i = 0; i < 36; i++) {
          const p = document.createElement("i");
          p.className = "particle";
          const angle = (Math.PI * 2 * i) / 36;
          const dist = 110 + ((i * 37) % 260);
          p.style.setProperty("--x", `${Math.cos(angle) * dist}px`);
          p.style.setProperty("--y", `${Math.sin(angle) * dist - 140}px`);
          p.style.setProperty("--s", `${6 + ((i * 11) % 16)}px`);
          p.style.setProperty("--d", `${(i % 9) * 38}ms`);
          particles.appendChild(p);
        }
      }

      function openChest() {
        const outcome = forcedOutcome || pickWeightedOutcome();
        lastOutcome = outcome;
        document.documentElement.style.setProperty("--accent", outcome.accent);
        chest.src = outcome.file;
        chest.alt = outcome.name;
        renderReward(outcome);
        makeParticles();
        stage.classList.remove("idle", "revealing", "revealed");
        void stage.offsetWidth;
        stage.classList.add("revealing");
        window.setTimeout(() => stage.classList.add("revealed"), 980);
        window.setTimeout(() => stage.classList.remove("revealing"), 1800);
      }

      function pickWeightedOutcome() {
        const bag = [
          ...Array(20).fill("ember"),
          ...Array(30).fill("forge"),
          ...Array(17).fill("titan"),
          ...Array(6).fill("olympian"),
          ...Array(2).fill("mythic"),
          ...Array(25).fill("relic"),
        ];
        const id = bag[Math.floor(Math.random() * bag.length)];
        return outcomes.find(outcome => outcome.id === id) || outcomes[1];
      }

      const label = document.createElement("div");
      label.className = "dev-label";
      label.textContent = "Dev preview controls";
      controls.appendChild(label);

      const randomButton = document.createElement("button");
      randomButton.dataset.id = "random";
      randomButton.innerHTML = "<strong>Random queue outcome</strong><span>Simulates backend reward result after click</span>";
      randomButton.onclick = () => setForcedOutcome(null);
      controls.appendChild(randomButton);

      outcomes.forEach(outcome => {
        const button = document.createElement("button");
        button.dataset.id = outcome.id;
        button.innerHTML = `<strong>Force ${outcome.name}</strong><span>Testing only. Chest stays neutral until opened.</span>`;
        button.onclick = () => setForcedOutcome(outcome);
        controls.appendChild(button);
      });

      document.getElementById("open").onclick = openChest;
      resetMystery();
      setForcedOutcome(null);
    </script>
  </body>
</html>

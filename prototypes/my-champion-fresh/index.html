<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VulcanX My Champion Prototype Fresh · Build MC-FRESH-ORG-1</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090c;
      --surface: #11131a;
      --surface-2: #171a23;
      --surface-3: #202431;
      --line: #2c3241;
      --text: #f5f6f9;
      --muted: #9aa2b3;
      --soft: #c9ced8;
      --accent: #ff9d2e;
      --accent-2: #ff6738;
      --green: #00c48c;
      --red: #ff4d6a;
      --blue: #4da2ff;
      --purple: #a855f7;
      --gold: #ffd76b;
      --radius: 8px;
      --shadow: 0 20px 70px rgba(0, 0, 0, 0.38);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    body.embedded .topbar {
      display: none;
    }

    body.embedded .layout {
      width: min(100vw - 24px, 1440px);
      padding: 14px 0 48px;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 66px;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 9, 12, 0.95);
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      width: min(1440px, calc(100vw - 32px));
      min-height: 66px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #160d05;
      display: grid;
      place-items: center;
      font-weight: 900;
      box-shadow: 0 0 24px rgba(255, 157, 46, 0.22);
    }

    .brand-title {
      font-weight: 900;
      line-height: 1.05;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
    }

    .nav {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav button,
    .icon-button,
    .btn {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--soft);
      border-radius: var(--radius);
      min-height: 38px;
      padding: 8px 12px;
      font-weight: 750;
      font-size: 13px;
    }

    .nav button.active,
    .btn.primary {
      background: var(--accent);
      color: #120d08;
      border-color: var(--accent);
    }

    .subnav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      overflow: visible;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .subnav.inset {
      margin: 12px 0 18px;
      box-shadow: none;
      background: var(--surface-2);
    }

    .subnav button {
      display: inline-grid;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 50px;
      border: 1px solid var(--line);
      background: #1c2230;
      color: #eef3fb;
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.1;
      font-weight: 800;
      text-align: center;
      -webkit-font-smoothing: antialiased;
      text-wrap: balance;
    }

    .subnav button.active {
      background: var(--accent);
      color: #120d08;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(255, 157, 46, 0.25), 0 8px 24px rgba(255, 157, 46, 0.18);
    }

    .btn.ghost {
      background: transparent;
    }

    .btn.danger {
      color: #ffd2da;
      border-color: rgba(255, 77, 106, 0.42);
      background: rgba(255, 77, 106, 0.11);
    }

    .wallet-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid rgba(0, 196, 140, 0.28);
      background: rgba(0, 196, 140, 0.08);
      color: var(--soft);
      font-size: 13px;
      font-weight: 750;
      white-space: nowrap;
    }

    .build-stamp {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 70;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 8px 10px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 157, 46, 0.35);
      background: rgba(10, 11, 15, 0.88);
      color: #ffe2b9;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .build-stamp strong {
      color: var(--accent);
      font-weight: 900;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(0, 196, 140, 0.55);
    }

    .layout {
      width: min(1440px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 26px 0 80px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 24px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero-copy {
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 380px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 62px);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .lead {
      margin: 0;
      color: var(--soft);
      line-height: 1.6;
      max-width: 620px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 22px;
    }

    .stat {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 12px;
      min-height: 74px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      color: var(--text);
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .champion-stage {
      position: relative;
      overflow: hidden;
      height: max(680px, calc(100vh - 124px));
      display: grid;
      grid-template-columns: minmax(270px, 0.9fr) minmax(260px, 1fr);
      gap: 0;
      background:
        linear-gradient(90deg, rgba(255,157,46,0.05), transparent 34%, rgba(77,162,255,0.04)),
        var(--surface);
    }

    .render-wrap {
      position: relative;
      min-height: 0;
      height: 100%;
      display: grid;
      place-items: center;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.07), transparent 24%),
        linear-gradient(145deg, var(--scene-a), var(--scene-b));
    }

    .render-wrap::before {
      content: none;
    }

    .render-wrap::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 40px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0,0,0,0.32);
      filter: blur(10px);
      pointer-events: none;
    }

    .render-frame {
      position: relative;
      width: min(440px, 84%);
      aspect-ratio: 3 / 4;
      border-radius: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
      z-index: 1;
    }

    .render-frame::before {
      content: none;
    }

    .champion-figure {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: var(--body-width);
      height: var(--body-height);
      transform: translateX(-50%) scale(1.18);
      transform-origin: bottom center;
    }

    .body {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 62%;
      height: 58%;
      transform: translateX(-50%);
      border-radius: 42% 42% 18% 18%;
      background: linear-gradient(160deg, var(--armor-a), var(--armor-b));
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: inset 0 18px 28px rgba(255,255,255,0.08), inset 0 -18px 24px rgba(0,0,0,0.2);
    }

    .body::before,
    .body::after {
      content: "";
      position: absolute;
      top: 12%;
      width: 32%;
      height: 54%;
      border-radius: 40%;
      background: linear-gradient(160deg, var(--skin-a), var(--skin-b));
      border: 2px solid rgba(255,255,255,0.12);
    }

    .body::before { left: -22%; transform: rotate(9deg); }
    .body::after { right: -22%; transform: rotate(-9deg); }

    .head {
      position: absolute;
      left: 50%;
      top: 10%;
      width: 42%;
      height: 31%;
      transform: translateX(-50%);
      border-radius: var(--head-radius);
      background: linear-gradient(160deg, var(--skin-a), var(--skin-b));
      border: 2px solid rgba(255,255,255,0.18);
      box-shadow: inset 0 12px 22px rgba(255,255,255,0.08), inset 0 -12px 18px rgba(0,0,0,0.18);
    }

    .head::before,
    .head::after {
      content: "";
      position: absolute;
      top: 42%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.1);
    }

    .head::before { left: 30%; }
    .head::after { right: 30%; }

    .hat {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: var(--hat-width);
      height: var(--hat-height);
      background: linear-gradient(160deg, var(--hat-a), var(--hat-b));
      clip-path: var(--hat-shape);
      border-radius: 8px;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,0.32));
    }

    .prop {
      position: absolute;
      right: 3%;
      bottom: 12%;
      width: 13%;
      height: 54%;
      border-radius: 8px;
      background: linear-gradient(180deg, var(--prop-a), var(--prop-b));
      transform: rotate(-12deg);
      box-shadow: 0 0 18px rgba(255,255,255,0.08);
    }

    .prop::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -18px;
      width: 38px;
      height: 38px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: var(--prop-a);
      box-shadow: 0 0 20px var(--prop-a);
    }

    .companion {
      position: absolute;
      left: 7%;
      bottom: 12%;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      background: radial-gradient(circle at 35% 30%, #fff, var(--companion-a) 28%, var(--companion-b));
      box-shadow: 0 0 22px var(--companion-a);
    }

    .title-ribbon {
      position: absolute;
      left: 40px;
      right: 40px;
      bottom: 2px;
      min-height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(7, 8, 11, 0.74);
      display: grid;
      place-items: center;
      color: var(--title);
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
    }

    .stage-nameplate {
      position: absolute;
      top: 26px;
      left: 26px;
      right: 26px;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .stage-nameplate strong {
      display: block;
      font-size: 18px;
      line-height: 1.05;
    }

    .stage-nameplate span {
      display: block;
      color: rgba(255,255,255,0.68);
      font-size: 12px;
      margin-top: 4px;
    }

    .stage-chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 9px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(7,8,11,0.6);
      color: var(--accent);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .render-meta {
      min-height: 0;
      height: 100%;
      padding: 44px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: flex-start;
    }

    .panel-scroll {
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      scrollbar-width: thin;
      display: block;
    }

    .panel-scroll > :first-child {
      margin-top: 0 !important;
    }

    .panel-scroll > * + * {
      margin-top: 18px;
    }

    .champion-heading {
      display: grid;
      gap: 10px;
    }

    .champion-heading h2 {
      margin: 0;
      font-size: clamp(30px, 4vw, 48px);
      line-height: 1.02;
    }

    .champion-heading p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      max-width: 620px;
    }

    .champion-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .hero-stat {
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 12px;
      min-height: 76px;
    }

    .hero-stat strong {
      display: block;
      color: var(--text);
      font-size: 24px;
      line-height: 1;
    }

    .hero-stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .rarity-strip {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
    }

    .rarity-cell {
      min-height: 8px;
      border-radius: 999px;
      background: var(--surface-3);
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .rarity-cell.active {
      background: linear-gradient(90deg, var(--accent), var(--gold));
      border-color: rgba(255,215,107,0.5);
      box-shadow: 0 0 14px rgba(255,157,46,0.22);
    }

    .loadout-feature {
      border: 1px solid rgba(255,157,46,0.24);
      background: rgba(255,157,46,0.07);
      border-radius: var(--radius);
      padding: 14px;
    }

    .loadout-feature strong {
      display: block;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .loadout-feature span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .loadout-list {
      display: grid;
      gap: 8px;
    }

    .loadout-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
    }

    .loadout-row span:last-child {
      color: var(--soft);
      font-weight: 800;
      text-align: right;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 18px;
      margin: 30px 0 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.1;
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .panel-scroll .grid,
    .panel-scroll .grid.three {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .slot-grid {
      grid-template-columns: 1fr !important;
    }

    .family-grid,
    .inventory-grid,
    .market-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    }

    .item-card,
    .feed-row,
    .leader-row {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 14px;
    }

    .item-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 218px;
    }

    .item-art {
      height: 92px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background:
        radial-gradient(circle at 50% 35%, var(--item-a), transparent 28%),
        linear-gradient(145deg, var(--item-b), #0a0b10);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .item-art::after {
      content: attr(data-slot);
      position: absolute;
      left: 8px;
      bottom: 8px;
      color: rgba(255,255,255,0.72);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .item-symbol {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.18);
      background: linear-gradient(135deg, var(--item-a), var(--item-b));
      transform: rotate(45deg);
      box-shadow: 0 0 22px var(--item-a);
    }

    .item-name {
      font-weight: 900;
      line-height: 1.2;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--muted);
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 850;
    }

    .pill.common { color: #cbd0da; }
    .pill.uncommon { color: #70dfad; border-color: rgba(0,196,140,0.3); }
    .pill.rare { color: #72b9ff; border-color: rgba(77,162,255,0.34); }
    .pill.epic { color: #c58cff; border-color: rgba(168,85,247,0.36); }
    .pill.legendary { color: #ffd76b; border-color: rgba(255,215,107,0.38); }
    .pill.mythic { color: #ff86b6; border-color: rgba(255,134,182,0.38); }
    .pill.fit { color: var(--green); border-color: rgba(0,196,140,0.28); }
    .pill.no-fit { color: #ffb1bf; border-color: rgba(255,77,106,0.28); }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .card-actions .btn {
      flex: 1;
      min-width: 0;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
    }

    .editor-shell {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .slot-rail {
      position: sticky;
      top: 92px;
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .slot-button {
      width: 100%;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--soft);
      border-radius: var(--radius);
      padding: 10px;
      min-height: 58px;
    }

    .slot-button.active {
      border-color: rgba(255,157,46,0.68);
      background: rgba(255,157,46,0.12);
      color: var(--text);
    }

    .slot-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.12);
      background: var(--surface-3);
      font-weight: 900;
      color: var(--accent);
    }

    .slot-name {
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .slot-equipped {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor-main {
      min-width: 0;
    }

    .editor-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .preview-panel {
      display: grid;

      grid-template-columns: repeat(2, minmax(0, 1fr));

      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      padding: 8px 10px;

      align-items: center;

      box-shadow: 0 0 50px rgba(255,157,46,0.18);

      content: "";
      position: absolute;
      left: 50%;
      top: 52%;
      width: 52px;
      height: 42px;
      transform: translate(-50%, -50%);
      border-radius: 8px;
      background: var(--accent);
      box-shadow: 0 0 20px rgba(255,157,46,0.5);

      position: absolute;
      left: 18px;
      right: 18px;
      top: 48%;
      height: 2px;
      background: rgba(255,255,255,0.18);

      height: 18px;

      transform: translateX(-50%);

      left: 50%;
      bottom: 7px;
      width: 28px;
      height: 20px;
      border-radius: 12px 12px 5px 5px;
      transform: translateX(-50%);
      background: var(--mini-armor, #384156);
    }

      min-width: 0;
      flex: 1;

    .row-title {

      white-space: nowrap;
      overflow: hidden;

    }

      font-size: 12px;
      margin-top: 3px;

      color: var(--accent);
      font-weight: 900;
      min-width: 36px;
    }

      z-index: 40;
      background: rgba(0, 0, 0, 0.6);
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

      right: 0;
      top: 0;
      bottom: 0;
      z-index: 41;

      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(100%);
      transition: transform 180ms ease;
      overflow-y: auto;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .drawer-body {
      padding: 18px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 60;
      transform: translateX(-50%);
      background: var(--surface-2);
      border: 1px solid rgba(255,157,46,0.35);
      color: var(--text);
      border-radius: var(--radius);
      padding: 12px 14px;
      box-shadow: var(--shadow);
      display: none;
      max-width: min(520px, calc(100vw - 32px));
      font-size: 13px;
      font-weight: 750;
    }

    }

    @media (max-width: 1040px) {
      .topbar-inner { flex-direction: column; align-items: stretch; padding: 14px 0; }

      .hero, .champion-stage, .chest-area, .editor-shell, .public-card { grid-template-columns: 1fr; }

      .subnav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid, .grid.three, .grid.two, .stats-grid, .inventory-summary, .hero-stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

      .grid, .grid.three, .grid.two, .stats-grid, .inventory-summary, .hero-stat-grid { grid-template-columns: 1fr; }
      .rarity-strip { grid-template-columns: repeat(6, 1fr); }
      .section-head { align-items: stretch; flex-direction: column; }
      .preview-panel { grid-template-columns: 1fr; }
      .hero-copy { padding: 20px; min-height: 0; }
      .render-meta { padding: 18px; }
      .render-wrap { min-height: 400px; }
      .render-frame { width: min(330px, 94vw); }
    }

</head>

      { rank: 1, user: "DragonSlayer99", family: "standard", frame: "#ff86b6", skin: "#c99c72", armor: "#6d5dfc", score: "48 cosmetics", rarest: "Mythic Warframe", item: "frame-mythic" },

    function filteredOwnedItems() {

        if (state.inventorySlot !== "all" && item.slot !== state.inventorySlot) return false;

        if (state.inventoryTradableOnly && !item.tradable) return false;

      };

        if (s.sceneB) defaults["--scene-b"] = s.sceneB;
        if (s.frame) defaults["--frame"] = s.frame;
        if (s.title) defaults["--title"] = s.title;
        if (s.companionA) defaults["--companion-a"] = s.companionA;
        if (s.companionB) defaults["--companion-b"] = s.companionB;
        if (s.armorA) defaults["--armor-a"] = s.armorA;
        if (s.armorB) defaults["--armor-b"] = s.armorB;
        if (s.hatA) defaults["--hat-a"] = s.hatA;
        if (s.hatB) defaults["--hat-b"] = s.hatB;
        if (s.hatWidth) defaults["--hat-width"] = s.hatWidth;
        if (s.hatHeight) defaults["--hat-height"] = s.hatHeight;
        if (s.hatShape) defaults["--hat-shape"] = s.hatShape;
        if (s.propA) defaults["--prop-a"] = s.propA;
        if (s.propB) defaults["--prop-b"] = s.propB;
      });
      return Object.entries(defaults).map(([key, value]) => `${key}:${value}`).join(";");
    }

    function lookMiniVars(look) {
      const family = families[look.family] || families[state.family];
      const equipped = look.equipped || state.equipped;
      const frame = byId(equipped.frame)?.style?.frame || "#cd7f32";
      const armor = byId(equipped.outfit)?.style?.armorA || "#384156";
      const background = byId(equipped.background)?.style || {};
      return [
        `--look-bg-a:${background.sceneA || "#26140b"}`,
        `--look-bg-b:${background.sceneB || "#0d0d12"}`,
        `--mini-frame:${frame}`,
        `--mini-skin:${family.skin[0]}`,
        `--mini-armor:${armor}`,
        `--mini-a:${background.sceneA || "#26140b"}`,
        `--mini-b:${background.sceneB || "#0d0d12"}`
      ].join(";");
    }

    function championRender() {
      const equipped = effectiveEquipped();

    function itemCard(item, context = "inventory") {
      const count = state.owned[item.id] || 0;
      const itemFits = fits(item);
      const canEquip = count > 0 && itemFits && ["background", "frame", "title", "companion", "outfit", "headgear", "prop"].includes(item.slot);
      const vars = `--item-a:${item.colors[0]};--item-b:${item.colors[1]}`;
      const isEquipped = state.equipped[item.slot] === item.id;
      const isPreviewing = state.previewItem === item.id;
      const classes = [
        "item-card",
        isEquipped ? "equipped" : "",
        !itemFits ? "incompatible" : "",
        isPreviewing ? "previewing" : ""
      ].filter(Boolean).join(" ");
      return `
        <article class="${classes}">
          <div class="item-art" style="${vars}" data-slot="${item.slot}"><div class="item-symbol"></div></div>
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-meta">
              <span class="${rarityClass(item.rarity)}">${item.rarity}</span>
              <span class="pill">${slotLabel(item.slot)}</span>
              <span class="pill ${itemFits ? "fit" : "no-fit"}">${itemFits ? "fits" : "off-archetype"}</span>
              ${isEquipped ? '<span class="pill fit">equipped</span>' : ""}
              ${item.tradable ? '<span class="pill">tradable</span>' : '<span class="pill">bound</span>'}
              ${count ? `<span class="pill">owned x${count}</span>` : ""}
            </div>
          </div>
          <div class="card-actions">
            ${canEquip ? `<button class="btn ${isEquipped ? "" : "primary"}" onclick="previewItem('${item.id}')">${isEquipped ? "Preview" : "Try On"}</button>` : ""}
            ${canEquip && !isEquipped ? `<button class="btn primary" onclick="equipItem('${item.id}')">Equip</button>` : ""}
            ${context === "market" ? `<button class="btn" onclick="marketAction('${item.id}')">${item.tradable ? "Make Offer" : "Inspect"}</button>` : ""}
            ${context !== "market" && item.tradable ? `<button class="btn" onclick="marketAction('${item.id}')">List</button>` : ""}
            ${!canEquip && context !== "market" ? `<button class="btn ghost" onclick="inspectItem('${item.id}')">Inspect</button>` : ""}
          </div>
        </article>
      `;
    }

            <div class="loadout-list">
              <div class="profile-row"><span>Rarest equipped</span><strong>${equipped.sort((a, b) => rarityRank[b.rarity] - rarityRank[a.rarity])[0]?.name || "None"}</strong></div>
              <div class="profile-row"><span>Tradable equipped</span><strong>${equipped.filter((item) => item.tradable).length}</strong></div>
              <div class="profile-row"><span>Saved looks</span><strong>${state.savedLooks.length}/3</strong></div>
              <div class="profile-row"><span>Fit family</span><strong>${families[state.family].label}</strong></div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn primary" onclick="setTab('gallery')">View Gallery</button>
              <button class="btn" onclick="setTab('market')">Find Similar Items</button>
              <button class="btn ghost" onclick="toast('Public share card mocked for this prototype.')">Share Card</button>
            </div>
          </div>
        </div>
        <div class="section-head">
          <div>
            <h2>Other User Preview Examples</h2>
            <p>These rows test how Champion previews can drive profile clicks and cosmetic demand.</p>
          </div>
        </div>
        <div>
          ${leaderboard.map((row, index) => `
            <button class="leader-row" style="width:100%;text-align:left;" onclick="openDrawer(${index})">
              <span class="rank">#${row.rank}</span>
              <span class="mini-avatar" style="--mini-frame:${row.frame};--mini-skin:${row.skin};--mini-armor:${row.armor};--mini-a:#20140c;--mini-b:#101722"></span>
              <span class="row-main">
                <span class="row-title">${row.user}</span>
                <span class="row-sub">${families[row.family].name} - rarest: ${row.rarest}</span>
              </span>
              <span class="pill legendary">${row.score}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderActivePanel() {
      const viewId = `view-${state.tab}`;
      switch (state.tab) {
        case "champion":
          renderChampion();
          break;
        case "inventory":
          renderInventory();
          break;
        case "gallery":
          renderGallery();
          break;
        case "market":
          renderMarket();
          break;
        case "leaderboard":
          renderLeaderboard();
          break;
        case "profile":
        default:
          renderProfile();
          break;
      }

      const activeView = document.getElementById(viewId);
      const panelContent = document.getElementById("panelContent");
      if (activeView && panelContent) {
        panelContent.innerHTML = activeView.innerHTML;
        panelContent.scrollTop = 0;
      }
    }

    function renderAll() {
      renderStage();
      renderActivePanel();
      document.querySelectorAll(".view").forEach((view) => {
        view.innerHTML = "";
      });
      renderStats();
      document.querySelectorAll("[data-tab]").forEach((button) => button.classList.toggle("active", button.dataset.tab === state.tab));
    }

    function setTab(tab) {
      state.tab = tab;
      if (tab !== "champion") state.previewItem = null;
      renderAll();
    }

    function setFamily(family) {
      state.family = family;
      Object.entries(state.equipped).forEach(([slot, id]) => {
        const item = byId(id);
        if (item && !fits(item, family)) {
          const replacement = ownedItems().find((candidate) => candidate.slot === slot && fits(candidate, family));
          if (replacement) state.equipped[slot] = replacement.id;
        }
      });
      if (state.previewItem && !fits(byId(state.previewItem), family)) state.previewItem = null;
      toast(`Champion body family set to ${families[family].name}.`);
      renderAll();
    }

    function setSelectedSlot(slot) {
      state.selectedSlot = slot;
      const preview = byId(state.previewItem);
      if (preview && preview.slot !== slot) state.previewItem = null;
      renderAll();
    }

    function previewItem(id) {
      const item = byId(id);
      if (!item || !state.owned[id]) return;
      if (!fits(item)) {
        toast(`${item.name} does not fit ${families[state.family].name}.`);
        return;
      }
      state.previewItem = id;
      state.selectedSlot = item.slot;
      toast(`Previewing ${item.name}.`);
      renderAll();
    }

    function clearPreview() {
      state.previewItem = null;
      renderAll();
    }

    function equipItem(id) {
      const item = byId(id);
      if (!item || !state.owned[id]) return;
      if (!fits(item)) {
        toast(`${item.name} does not fit ${families[state.family].name}. Use the marketplace instead.`);
        return;
      }
      state.equipped[item.slot] = id;
      state.selectedSlot = item.slot;
      state.previewItem = null;
      toast(`${item.name} equipped.`);
      renderAll();
    }

    function inspectItem(id) {
      const item = byId(id);
      toast(`${item.name}: ${item.rarity}, ${item.tradable ? "tradable" : "account-bound"}, ${fits(item) ? "fits current Champion" : "off-archetype"}.`);
    }

    function marketAction(id) {
      const item = byId(id);
      toast(`${item.name}: marketplace action mocked. Price signal: ${item.price || "not listed"} PYR.`);
    }

    function weightedPick(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function simulateCosmeticDrop() {
      const roll = Math.random();
      let bucket = "universal";
      let pool = cosmetics.filter(isUniversal);

      if (roll >= 0.4 && roll < 0.75) {
        bucket = "compatible";
        pool = cosmetics.filter((item) => fits(item));
      } else if (roll >= 0.75 && roll < 0.9) {
        bucket = "off-archetype tradable";
        pool = cosmetics.filter((item) => item.tradable && !fits(item));
      } else if (roll >= 0.9) {
        bucket = "jackpot";
        pool = cosmetics.filter((item) => rarityRank[item.rarity] >= 4);
      }

      const item = weightedPick(pool.length ? pool : cosmetics);
      state.owned[item.id] = (state.owned[item.id] || 0) + 1;
      state.cosmeticsReceived += 1;
      state.reveal = `Received from ${bucket} bucket: ${item.name} (${item.rarity}). ${fits(item) ? "Can equip now." : "Off-archetype item: sell, hold, or trade."}`;

      if (rarityRank[item.rarity] >= 3) {
        state.feed.unshift({ user: "0x71a...f29d", item: item.name, rarity: item.rarity, note: `received from ${bucket} bucket` });
      }
      toast(`Cosmetic received: ${item.name}`);
      renderAll();
    }

    function burnDuplicate() {
      const duplicate = ownedItems().find((item) => (state.owned[item.id] || 0) > 1 && rarityRank[item.rarity] <= 2);
      if (!duplicate) {
        toast("No low-tier duplicate available to burn.");
        return;
      }
      state.owned[duplicate.id] -= 1;
      state.shards += duplicate.rarity === "uncommon" ? 2 : 1;
      toast(`Burned ${duplicate.name} for forge shards.`);
      renderAll();
    }

    function fuseShards() {
      if (state.shards < 5) {
        toast("You need 5 shards to fuse.");
        return;
      }
      state.shards -= 5;
      const pool = cosmetics.filter((item) => ["rare", "epic"].includes(item.rarity));
      const item = weightedPick(pool);
      state.owned[item.id] = (state.owned[item.id] || 0) + 1;
      state.reveal = `Fusion created ${item.name} (${item.rarity}).`;
      state.feed.unshift({ user: "0x71a...f29d", item: item.name, rarity: item.rarity, note: "created through shard fusion" });
      toast(`Fusion complete: ${item.name}`);
      renderAll();
    }

    function saveLook() {
      const look = {
        name: `Look ${state.savedLooks.length + 1}`,
        family: state.family,
        equipped: { ...state.equipped }
      };
      state.savedLooks.unshift(look);
      state.savedLooks = state.savedLooks.slice(0, 3);
      toast("Saved current Champion look.");
      renderAll();
    }

    function restoreLook(index) {
      const look = state.savedLooks[index];
      if (!look) {
        toast("Save a look first, then you can load it from the gallery.");
        return;
      }
      state.family = look.family;
      state.equipped = { ...look.equipped };
      toast(`${look.name} loaded.`);
      renderAll();
    }

    function openDrawer(index) {
      const row = leaderboard[index];
      const item = byId(row.item);
      document.getElementById("drawer").innerHTML = `
        <div class="drawer-head">
          <div>
            <div class="eyebrow">Champion Preview</div>
            <div style="font-size:22px;font-weight:900;">${row.user}</div>
          </div>
          <button class="icon-button" onclick="closeDrawer()">Close</button>
        </div>
        <div class="drawer-body">
          <div class="mini-avatar" style="width:160px;height:160px;margin:0 auto 18px;--mini-frame:${row.frame};--mini-skin:${row.skin};--mini-armor:${row.armor};--mini-a:#20140c;--mini-b:#101722"></div>
          <div class="loadout-list">
            <div class="loadout-row"><span>Rank</span><span>#${row.rank}</span></div>
            <div class="loadout-row"><span>Body Family</span><span>${families[row.family].name}</span></div>
            <div class="loadout-row"><span>Cosmetic activity</span><span>${row.score}</span></div>
            <div class="loadout-row"><span>Rarest Cosmetic</span><span>${row.rarest}</span></div>
          </div>
          <div style="margin-top:16px;">${item ? itemCard(item, "market") : ""}</div>
        </div>
      `;
      document.getElementById("drawerBackdrop").classList.add("open");
      document.getElementById("drawer").classList.add("open");
    }

    function closeDrawer() {
      document.getElementById("drawerBackdrop").classList.remove("open");
      document.getElementById("drawer").classList.remove("open");
    }

    function toast(message) {
      const el = document.getElementById("toast");
      el.textContent = message;
      el.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => el.classList.remove("show"), 2200);
    }

    document.querySelectorAll("[data-tab]").forEach((button) => {
      button.addEventListener("click", () => setTab(button.dataset.tab));
    });

    document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);
    window.setTab = setTab;
    window.setFamily = setFamily;
    window.setSelectedSlot = setSelectedSlot;
    window.previewItem = previewItem;
    window.clearPreview = clearPreview;
    window.equipItem = equipItem;
    window.inspectItem = inspectItem;
    window.marketAction = marketAction;
    window.simulateCosmeticDrop = simulateCosmeticDrop;
    window.burnDuplicate = burnDuplicate;
    window.fuseShards = fuseShards;
    window.saveLook = saveLook;
    window.restoreLook = restoreLook;
    window.openDrawer = openDrawer;
    window.closeDrawer = closeDrawer;
    window.state = state;

    if (window.self !== window.top) {
      document.body.classList.add("embedded");
    }

    renderAll();
  </script>
</body>
</html>
